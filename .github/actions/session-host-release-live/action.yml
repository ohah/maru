name: Session host baseline-A live release workflow
description: Run the closed eight-stage signed session-host release transaction

inputs:
  gh-path:
    description: Canonical runner-provided GitHub CLI pathname captured before checkout
    required: true
  gh-sha256:
    description: SHA-256 of the captured GitHub CLI
    required: true
  zig-path:
    description: Canonical Zig pathname captured after mise
    required: true
  zig-size:
    description: Decimal byte size of the captured Zig executable
    required: true
  zig-sha256:
    description: SHA-256 of the captured Zig executable
    required: true

runs:
  using: composite
  steps:
  - name: Derive closed live workflow paths
    id: setup
    shell: bash
    env:
      MARU_REF_TYPE: ${{ github.ref_type }}
      MARU_TAG: ${{ github.ref_name }}
      MARU_REPOSITORY: ${{ github.repository }}
      MARU_WORKSPACE: ${{ github.workspace }}
    run: |
      set -euo pipefail
      umask 077
      test "$MARU_REF_TYPE" = tag
      test "$MARU_REPOSITORY" = ohah/maru
      case "$MARU_TAG" in
        v[0-9]*.[0-9]*.[0-9]*) ;;
        *) exit 1 ;;
      esac
      MARU_VERSION=${MARU_TAG#v}
      MARU_CHECKPOINT_ROOT="$RUNNER_TEMP/maru-session-host-release-checkpoints"
      MARU_LIVE_ROOT="$RUNNER_TEMP/maru-session-host-release-live"
      MARU_CANDIDATE="$MARU_WORKSPACE/dist/session-host-candidate-$MARU_VERSION"
      MARU_EVIDENCE="$MARU_LIVE_ROOT/durable-preparation/baseline-evidence.json"
      MARU_UPGRADE_EVIDENCE="$MARU_LIVE_ROOT/durable-preparation/upgrade-evidence.json"
      MARU_MANIFEST="$MARU_LIVE_ROOT/Maru-$MARU_VERSION-session-host-release.json"
      test ! -e "$MARU_CHECKPOINT_ROOT"
      test ! -L "$MARU_CHECKPOINT_ROOT"
      test ! -e "$MARU_LIVE_ROOT"
      test ! -L "$MARU_LIVE_ROOT"
      /bin/mkdir -m 0700 "$MARU_CHECKPOINT_ROOT" "$MARU_LIVE_ROOT"
      MARU_UUID=$(/usr/bin/uuidgen | /usr/bin/tr '[:upper:]' '[:lower:]')
      [[ "$MARU_UUID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
      MARU_ROOT_IDENTITY=$("$MARU_WORKSPACE/zig-out/bin/maru-session-host-release-workflow-bootstrap" initialize "$MARU_CHECKPOINT_ROOT")
      [[ "$MARU_ROOT_IDENTITY" =~ ^maru-root-v1:[0-9a-f]{16}-[0-9a-f]{16}-[0-9a-f]{8}-[0-9a-f]{8}$ ]]
      {
        printf 'version=%s\n' "$MARU_VERSION"
        printf 'checkpoint-root=%s\n' "$MARU_CHECKPOINT_ROOT"
        printf 'checkpoint-root-identity=%s\n' "$MARU_ROOT_IDENTITY"
        printf 'candidate=%s\n' "$MARU_CANDIDATE"
        printf 'dmg=%s/Maru-%s-universal.dmg\n' "$MARU_CANDIDATE" "$MARU_VERSION"
        printf 'dmg-name=Maru-%s-universal.dmg\n' "$MARU_VERSION"
        printf 'frozen=%s/maru-session-host-%s\n' "$MARU_CANDIDATE" "$MARU_VERSION"
        printf 'frozen-name=maru-session-host-%s\n' "$MARU_VERSION"
        printf 'app-main=%s/Maru.app/Contents/MacOS/maru-macos-app\n' "$MARU_CANDIDATE"
        printf 'app-cli=%s/Maru.app/Contents/MacOS/maru\n' "$MARU_CANDIDATE"
        printf 'dmg-work=%s/dmg-work\n' "$MARU_LIVE_ROOT"
        printf 'baseline-workspace=%s/baseline-workspace\n' "$MARU_LIVE_ROOT"
        printf 'predecessor-workspace=%s/predecessor-workspace\n' "$MARU_LIVE_ROOT"
        printf 'upgrade-workspace=%s/upgrade-workspace\n' "$MARU_LIVE_ROOT"
        printf 'timing-output=%s/profile-upgrade-timing.json\n' "$MARU_LIVE_ROOT"
        printf 'manifest=%s\n' "$MARU_MANIFEST"
        printf 'preparation=%s/durable-preparation\n' "$MARU_LIVE_ROOT"
        printf 'evidence=%s\n' "$MARU_EVIDENCE"
        printf 'upgrade-evidence=%s\n' "$MARU_UPGRADE_EVIDENCE"
        printf 'aggregate=%s/durable-aggregate\n' "$MARU_LIVE_ROOT"
        printf 'test-uuid=%s\n' "$MARU_UUID"
      } >> "$GITHUB_OUTPUT"

  - name: Pin signed candidate inputs
    id: session-host-candidate-pinning
    shell: bash
    env:
      MARU_CHECKPOINT_ROOT: ${{ steps.setup.outputs.checkpoint-root }}
      MARU_CHECKPOINT_ROOT_IDENTITY: ${{ steps.setup.outputs.checkpoint-root-identity }}
      MARU_CANDIDATE: ${{ steps.setup.outputs.candidate }}
      MARU_CANDIDATE_EXE: ${{ github.workspace }}/zig-out/bin/maru-session-host-release-workflow-candidate-inputs
    run: |
      set -euo pipefail
      "$MARU_CANDIDATE_EXE" pin "$MARU_CHECKPOINT_ROOT" "$MARU_CHECKPOINT_ROOT_IDENTITY" "$MARU_CANDIDATE"

  - name: Attest signed candidate pair
    id: session-host-candidate-attestation
    uses: ./.github/actions/session-host-release-live-candidate-attestation
    with:
      dmg-path: ${{ steps.setup.outputs.dmg }}
      dmg-name: ${{ steps.setup.outputs.dmg-name }}
      frozen-path: ${{ steps.setup.outputs.frozen }}
      frozen-name: ${{ steps.setup.outputs.frozen-name }}
      checkpoint-root: ${{ steps.setup.outputs.checkpoint-root }}
      checkpoint-root-identity: ${{ steps.setup.outputs.checkpoint-root-identity }}

  - name: Author profile-selected evidence and draft
    id: session-host-draft-authoring
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MARU_WORKFLOW_EXE: ${{ github.workspace }}/zig-out/bin/maru-session-host-release-workflow-command
      MARU_ROOT: ${{ steps.setup.outputs.checkpoint-root }}
      MARU_ROOT_IDENTITY: ${{ steps.setup.outputs.checkpoint-root-identity }}
      MARU_TAG: ${{ github.ref_name }}
      MARU_GH: ${{ inputs.gh-path }}
      MARU_GH_SHA256: ${{ inputs.gh-sha256 }}
      MARU_UUID: ${{ steps.setup.outputs.test-uuid }}
      MARU_DMG: ${{ steps.setup.outputs.dmg }}
      MARU_FROZEN: ${{ steps.setup.outputs.frozen }}
      MARU_DMG_WORK: ${{ steps.setup.outputs.dmg-work }}
      MARU_BASELINE_WORKSPACE: ${{ steps.setup.outputs.baseline-workspace }}
      MARU_PREDECESSOR_WORKSPACE: ${{ steps.setup.outputs.predecessor-workspace }}
      MARU_UPGRADE_WORKSPACE: ${{ steps.setup.outputs.upgrade-workspace }}
      MARU_TIMING_OUTPUT: ${{ steps.setup.outputs.timing-output }}
      MARU_APP_MAIN: ${{ steps.setup.outputs.app-main }}
      MARU_APP_CLI: ${{ steps.setup.outputs.app-cli }}
      MARU_MANIFEST: ${{ steps.setup.outputs.manifest }}
      MARU_SOURCE_ROOT: ${{ github.workspace }}
      MARU_ZIG: ${{ inputs.zig-path }}
      MARU_ZIG_SIZE: ${{ inputs.zig-size }}
      MARU_ZIG_SHA256: ${{ inputs.zig-sha256 }}
      MARU_DMG_BUNDLE: ${{ steps.session-host-candidate-attestation.outputs.dmg-bundle-path }}
      MARU_FROZEN_BUNDLE: ${{ steps.session-host-candidate-attestation.outputs.frozen-bundle-path }}
      MARU_PREPARATION: ${{ steps.setup.outputs.preparation }}
    run: |
      set -euo pipefail
      "$MARU_WORKFLOW_EXE" run-profiled-stage3 "$MARU_ROOT" "$MARU_ROOT_IDENTITY" \
        --repo ohah/maru --tag "$MARU_TAG" \
        --github-cli "$MARU_GH" --github-cli-sha256 "$MARU_GH_SHA256" \
        --test-uuid "$MARU_UUID" --dmg "$MARU_DMG" --frozen-executable "$MARU_FROZEN" \
        --candidate-dmg-bundle "$MARU_DMG_BUNDLE" --candidate-frozen-bundle "$MARU_FROZEN_BUNDLE" \
        --dmg-work "$MARU_DMG_WORK" --baseline-workspace "$MARU_BASELINE_WORKSPACE" \
        --app-main-executable "$MARU_APP_MAIN" --app-cli-executable "$MARU_APP_CLI" \
        --manifest "$MARU_MANIFEST" --source-root "$MARU_SOURCE_ROOT" \
        --zig "$MARU_ZIG" --zig-size "$MARU_ZIG_SIZE" --zig-sha256 "$MARU_ZIG_SHA256" \
        --durable-preparation "$MARU_PREPARATION" \
        --predecessor-workspace "$MARU_PREDECESSOR_WORKSPACE" \
        --upgrade-workspace "$MARU_UPGRADE_WORKSPACE" --timing-output "$MARU_TIMING_OUTPUT"

  - name: Attest authored evidence pair
    id: session-host-authored-attestation
    uses: ./.github/actions/session-host-release-live-authored-attestation
    with:
      preparation-path: ${{ steps.setup.outputs.preparation }}
      baseline-evidence-path: ${{ steps.setup.outputs.evidence }}
      upgrade-evidence-path: ${{ steps.setup.outputs.upgrade-evidence }}
      manifest-path: ${{ steps.setup.outputs.manifest }}
      timing-path: ${{ steps.setup.outputs.timing-output }}
      gh-path: ${{ inputs.gh-path }}
      gh-sha256: ${{ inputs.gh-sha256 }}
      checkpoint-root: ${{ steps.setup.outputs.checkpoint-root }}
      checkpoint-root-identity: ${{ steps.setup.outputs.checkpoint-root-identity }}

  - name: Prepare attestation aggregate
    id: session-host-aggregate-prepare
    shell: bash
    env:
      MARU_WORKFLOW_EXE: ${{ github.workspace }}/zig-out/bin/maru-session-host-release-workflow-command
      MARU_ROOT: ${{ steps.setup.outputs.checkpoint-root }}
      MARU_ROOT_IDENTITY: ${{ steps.setup.outputs.checkpoint-root-identity }}
      MARU_TAG: ${{ github.ref_name }}
      MARU_GH: ${{ inputs.gh-path }}
      MARU_GH_SHA256: ${{ inputs.gh-sha256 }}
      MARU_EVIDENCE: ${{ steps.session-host-authored-attestation.outputs.evidence-path }}
      MARU_DMG_BUNDLE: ${{ steps.session-host-candidate-attestation.outputs.dmg-bundle-path }}
      MARU_FROZEN_BUNDLE: ${{ steps.session-host-candidate-attestation.outputs.frozen-bundle-path }}
      MARU_EVIDENCE_BUNDLE: ${{ steps.session-host-authored-attestation.outputs.evidence-bundle-path }}
      MARU_MANIFEST_BUNDLE: ${{ steps.session-host-authored-attestation.outputs.manifest-bundle-path }}
      MARU_TIMING_BUNDLE: ${{ steps.session-host-authored-attestation.outputs.timing-bundle-path }}
      MARU_AGGREGATE: ${{ steps.setup.outputs.aggregate }}
    run: |
      set -euo pipefail
      args=("$MARU_WORKFLOW_EXE" run "$MARU_ROOT" "$MARU_ROOT_IDENTITY" \
        prepare-candidate-aggregate --repo ohah/maru --tag "$MARU_TAG" \
        --github-cli "$MARU_GH" --github-cli-sha256 "$MARU_GH_SHA256" \
        --evidence "$MARU_EVIDENCE" --candidate-dmg-bundle "$MARU_DMG_BUNDLE" \
        --candidate-frozen-bundle "$MARU_FROZEN_BUNDLE" --evidence-bundle "$MARU_EVIDENCE_BUNDLE" \
        --manifest-bundle "$MARU_MANIFEST_BUNDLE")
      if [[ -n "$MARU_TIMING_BUNDLE" ]]; then
        args+=(--timing-bundle "$MARU_TIMING_BUNDLE")
      fi
      args+=(--aggregate "$MARU_AGGREGATE")
      "${args[@]}"

  - name: Finalize attestation aggregate
    id: session-host-aggregate-finalize
    shell: bash
    env:
      MARU_WORKFLOW_EXE: ${{ github.workspace }}/zig-out/bin/maru-session-host-release-workflow-command
      MARU_ROOT: ${{ steps.setup.outputs.checkpoint-root }}
      MARU_ROOT_IDENTITY: ${{ steps.setup.outputs.checkpoint-root-identity }}
      MARU_TAG: ${{ github.ref_name }}
      MARU_GH: ${{ inputs.gh-path }}
      MARU_GH_SHA256: ${{ inputs.gh-sha256 }}
      MARU_AGGREGATE: ${{ steps.setup.outputs.aggregate }}
      MARU_DMG: ${{ steps.setup.outputs.dmg }}
      MARU_FROZEN: ${{ steps.setup.outputs.frozen }}
      MARU_MANIFEST: ${{ steps.setup.outputs.manifest }}
      MARU_TIMING: ${{ steps.session-host-authored-attestation.outputs.timing-path }}
    run: |
      set -euo pipefail
      args=("$MARU_WORKFLOW_EXE" run "$MARU_ROOT" "$MARU_ROOT_IDENTITY" \
        finalize-candidate-aggregate --repo ohah/maru --tag "$MARU_TAG" \
        --github-cli "$MARU_GH" --github-cli-sha256 "$MARU_GH_SHA256" \
        --aggregate "$MARU_AGGREGATE" --dmg "$MARU_DMG" \
        --frozen-executable "$MARU_FROZEN" --manifest "$MARU_MANIFEST")
      if [[ -n "$MARU_TIMING" ]]; then
        args+=(--timing "$MARU_TIMING")
      fi
      "${args[@]}"

  - name: Publish candidate release
    id: session-host-publication
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MARU_WORKFLOW_EXE: ${{ github.workspace }}/zig-out/bin/maru-session-host-release-workflow-command
      MARU_ROOT: ${{ steps.setup.outputs.checkpoint-root }}
      MARU_ROOT_IDENTITY: ${{ steps.setup.outputs.checkpoint-root-identity }}
      MARU_TAG: ${{ github.ref_name }}
      MARU_GH: ${{ inputs.gh-path }}
      MARU_GH_SHA256: ${{ inputs.gh-sha256 }}
      MARU_PREPARATION: ${{ steps.setup.outputs.preparation }}
      MARU_AGGREGATE: ${{ steps.setup.outputs.aggregate }}
      MARU_DMG: ${{ steps.setup.outputs.dmg }}
      MARU_FROZEN: ${{ steps.setup.outputs.frozen }}
    run: |
      set -euo pipefail
      "$MARU_WORKFLOW_EXE" run "$MARU_ROOT" "$MARU_ROOT_IDENTITY" \
        resume-candidate-publication --repo ohah/maru --tag "$MARU_TAG" \
        --github-cli "$MARU_GH" --github-cli-sha256 "$MARU_GH_SHA256" \
        --preparation "$MARU_PREPARATION" --aggregate "$MARU_AGGREGATE" \
        --dmg "$MARU_DMG" --frozen-executable "$MARU_FROZEN"

  - name: Clean verified aggregate
    id: session-host-aggregate-cleanup
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MARU_WORKFLOW_EXE: ${{ github.workspace }}/zig-out/bin/maru-session-host-release-workflow-command
      MARU_ROOT: ${{ steps.setup.outputs.checkpoint-root }}
      MARU_ROOT_IDENTITY: ${{ steps.setup.outputs.checkpoint-root-identity }}
      MARU_TAG: ${{ github.ref_name }}
      MARU_GH: ${{ inputs.gh-path }}
      MARU_GH_SHA256: ${{ inputs.gh-sha256 }}
      MARU_AGGREGATE: ${{ steps.setup.outputs.aggregate }}
      MARU_DMG: ${{ steps.setup.outputs.dmg }}
      MARU_FROZEN: ${{ steps.setup.outputs.frozen }}
      MARU_MANIFEST: ${{ steps.setup.outputs.manifest }}
    run: |
      set -euo pipefail
      "$MARU_WORKFLOW_EXE" run "$MARU_ROOT" "$MARU_ROOT_IDENTITY" \
        cleanup-candidate-aggregate --repo ohah/maru --tag "$MARU_TAG" \
        --github-cli "$MARU_GH" --github-cli-sha256 "$MARU_GH_SHA256" \
        --aggregate "$MARU_AGGREGATE" --dmg "$MARU_DMG" \
        --frozen-executable "$MARU_FROZEN" --manifest "$MARU_MANIFEST"
