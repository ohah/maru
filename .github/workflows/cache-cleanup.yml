name: Cache cleanup

# Actions 캐시가 저장소 한도(10GB)를 밀어 올리는 것을 막는다.
#
# **왜 필요한가.** 두 가지가 계속 쌓인다:
#  1) 빌드 캐시 키에 `github.sha`가 들어가 **main push마다 새 항목**이 생긴다. 최신 하나면 충분한데
#     같은 잡의 옛 항목이 만료(7일)까지 남는다. 실측: 확대 직후 Zig 캐시가 11개 1752MB까지 갔고,
#     2026-08-17에는 잡 6종이 sha 3~4개씩 남겨 항목 32개 9.99GB로 **한도에 붙었다**.
#  2) 액션이 PR ref(`refs/pull/N/merge`)에 저장하는 캐시가 있다. GitHub 캐시는 **ref 스코프**라
#     그 캐시는 그 PR만 읽을 수 있고, PR이 닫히면 **아무도 못 읽으면서** 한도만 먹는다.
#     실측: 닫힌 PR 13개가 남긴 죽은 캐시 36개 = 4.9GB.
#
# 한도에 닿으면 GitHub이 LRU로 밀어내므로, 그대로 두면 **살아 있는 캐시가 죽은 캐시에 밀려난다**.
# 실제로 88%까지 찼던 적이 있고 그 상태에서 적중률이 떨어졌다.
#
# **무엇을 지우나.** 보수적으로 둘만 지운다:
#  - 닫히거나 머지된 PR ref의 캐시 (아무도 못 읽는다)
#  - main의 같은 그룹에서 **최신 1개를 넘는** 옛 항목.
#    처음엔 「1개만 남기면 직전 커밋을 재실행할 때 미스가 난다」고 2개를 남겼는데, 그 우려는 성립하지 않는다 —
#    ci.yml 의 복원 스텝 8개가 **전부** `restore-keys` 접두 폴백을 갖고 있어(2026-09-06 확인, 판정자
#    `tests/ci_cache_generations_boundary.zig` 가 8:8 을 센다) 정확한 sha 키가 없어도 그룹의 최신 항목을 적중한다.
#    2개를 남기면 잡 9종 × 2세대 ≈ 9GB 가 정상 상태라 늘 한도에 붙는다(실측 2026-09-06: 29개 10.8GB 로 한도 초과,
#    LRU 가 살아 있는 캐시를 밀어냈다). 1개면 약 4.9GB 다.
# 열린 PR의 캐시는 그 PR 재실행에 쓰일 수 있으므로 **건드리지 않는다**.

# **언제 도는가.** 매일 한 번으로는 늦었다 — 2026-08-17 실측: 하루 안에 항목 32개 9.99GB 로
# 한도(10GB)에 닿았다. 머지가 몰리는 날은 스케줄이 오기 전에 이미 LRU 밀어내기가 시작된다.
# 그래서 **main CI 가 끝나는 즉시** 한 번 더 돈다. 캐시를 저장하는 것이 바로 그 실행이므로,
# 초과분이 생기는 시점과 걷어내는 시점이 붙는다. 스케줄은 안전망으로 남긴다
# (workflow_run 이 실패하거나 CI 가 아예 안 돈 날을 위해).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    # 안전망. main push 가 없던 날에도 닫힌 PR 캐시는 남는다.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "지우지 않고 대상만 출력한다"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # 캐시 삭제에 필요

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: prune stale caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # 스케줄 실행은 실제로 지운다. 수동 실행은 기본이 dry-run이라 목록만 본다.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from collections import defaultdict

          repo = os.environ["REPO"]
          dry = os.environ.get("DRY_RUN", "false") == "true"

          def api(*args):
              out = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              return out.stdout

          caches = []
          page = 1
          while True:
              raw = api(f"repos/{repo}/actions/caches?per_page=100&page={page}")
              if not raw.strip():
                  break
              items = json.loads(raw).get("actions_caches", [])
              if not items:
                  break
              caches.extend(items)
              page += 1
              if page > 20:
                  break

          total = sum(c["size_in_bytes"] for c in caches)
          print(f"현재 캐시 {len(caches)}개 / {total // 1048576}MB")

          doomed = []

          # ① 닫힌/머지된 PR ref
          pr_state = {}
          for c in caches:
              m = re.match(r"^refs/pull/(\d+)/merge$", c.get("ref", ""))
              if not m:
                  continue
              num = m.group(1)
              if num not in pr_state:
                  raw = api(f"repos/{repo}/pulls/{num}", "--jq", ".state")
                  pr_state[num] = raw.strip() or "unknown"
              if pr_state[num] == "closed":  # GitHub은 머지도 closed로 준다
                  doomed.append((c, f"PR #{num} 닫힘"))

          # ② main의 그룹별 최신 1개 초과분 (위 주석 — 복원은 전부 접두 폴백이라 1개면 충분하다)
          groups = defaultdict(list)
          for c in caches:
              if c.get("ref") != "refs/heads/main":
                  continue
              group = re.sub(r"-[0-9a-f]{16,}.*$", "", c["key"])
              groups[group].append(c)
          for group, items in groups.items():
              items.sort(key=lambda c: c["created_at"], reverse=True)
              for c in items[1:]:
                  doomed.append((c, f"{group} 최신 1개 초과"))

          freed = sum(c["size_in_bytes"] for c, _ in doomed)
          print(f"대상 {len(doomed)}개 / {freed // 1048576}MB 회수 예정 (dry_run={dry})")
          for c, why in doomed:
              print(f"  - {c['size_in_bytes'] // 1048576:>4}MB  {c['key'][:60]}  ({why})")
              if not dry:
                  subprocess.run(["gh", "api", "-X", "DELETE",
                                  f"repos/{repo}/actions/caches/{c['id']}"],
                                 capture_output=True, text=True)
          PY
