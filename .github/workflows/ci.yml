name: CI

on:
  push:
    branches: [main]
  # draft 를 푸는 순간을 잡으려면 ready_for_review 가 필요하다 — 기본 types 에는 없어서
  # 그 전환에 아무 이벤트도 안 오고, draft 동안 건너뛴 job 이 영영 안 돈다.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # 수동 실행. `session host macOS (ReleaseFast)` 가 이 이벤트에서만 도는 유일한 잡이므로,
  # 릴리스 빌드 전에는 반드시 한 번 돌린다: `gh workflow run ci.yml`.
  # 다른 잡들도 함께 도는데, `changes` 가 base/head 없이 fail-safe 로 전 영역을 켜기 때문이다
  # (릴리스 전 전수 검증이 목적이라 그 편이 맞다).
  workflow_dispatch:

# 같은 ref에서 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 변경 영역 판정. 문서만 고친 PR에서 macOS 러너 세 대와 외부 오라클까지 도는 것은 순수한 낭비다.
  # 분류 정책의 단일 출처는 tools/ci/changed-areas.sh이고, 아래 job들은 그 플래그만 소비한다.
  #
  # `code`와 `runtime`을 나눠 쓴다. macOS·오라클·성능 job은 `runtime`을 보므로 **주석만 고친 코드
  # 변경에서는 건너뛴다**(분류기는 확장자로만 영역을 가르는 탓에, 문서 경로를 가리키는 주석 한 줄에
  # 러너 다섯 대가 돌던 문제다). 반면 `check`는 `code`를 그대로 봐야 한다 — check-boundaries의
  # external source digest가 doc comment를 잠그기 때문이다.
  #
  # workflow-level `paths` 필터가 아니라 job-level `if`인 이유: required 워크플로에 `paths`를 두면
  # 무관한 PR에서 트리거 자체가 안 돼 required 컨텍스트가 영원히 pending으로 머지를 막는다. 반면
  # 조건으로 건너뛴 job은 conclusion=skipped로 보고되고 branch protection은 이를 통과로 취급한다.
  # 필수 체크 목록의 단일 출처는 docs/performance-budget.md "필수 CI 체크"다.
  #
  # 이 job은 required 컨텍스트가 아니다. 실패하면 소비 job들이 `needs.changes.result != 'success'`
  # 로 fail-safe 실행되므로, 판정이 없을 때 게이트가 조용히 열리지 않는다.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      runtime: ${{ steps.areas.outputs.runtime }}
      web: ${{ steps.areas.outputs.web }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      # three-dot diff에 merge-base가 필요해 전체 히스토리를 받는다(얕은 클론은 base.sha가 없다).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # 분류가 틀리면 게이트가 조용히 열린다. 판정을 쓰기 전에 분류기 자신을 먼저 검증한다
      # (순수 sh라 수 초). web.yml·performance.yml은 같은 스크립트를 쓰므로 여기서 한 번만 돈다.
      - run: sh tools/ci/changed-areas.test.sh
      - id: areas
        # push(main)에서는 두 값이 비어 전 영역 실행으로 떨어진다 — main은 항상 전부 검증한다.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh tools/ci/changed-areas.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  # 기본 게이트: fmt-check, unit, e2e, recorded oracle, stress, facade import 경계와 build를
  # 한 번에 검증한다. SVG hash/C·Zig registry는 외부 도구 없이 Zig test가 검증한다.
  #
  # 이 job만 조건부 skip이 아니라 **항상 실행**하고 안에서 범위를 줄인다. check-config-docs와
  # check-doc-links가 docs/*.md를 런타임에 훑는 게이트라(tests/config_docs/keys.zig·
  # tests/doc_links/links.zig) 문서만 바뀐 PR에서도 실행돼야 한다 — 문서가 없는 config 키를
  # 설정처럼 소개하는 드리프트와, 절이 다른 파일로 옮겨가 죽은 `#앵커`는 이 둘만 잡는다. web만 바뀐 PR은
  # 검사할 것이 없어 즉시 통과한다(Zig 툴체인조차 세우지 않는다).
  check:
    name: check
    needs: changes
    if: ${{ github.event.pull_request.draft != true && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # **중간 커밋 검사가 히스토리를 요구한다.** 기본 depth=1 이면 `base.sha` 도 `head.sha` 도
          # 이 클론에 없어 `git rev-list base..head` 가 `fatal: Invalid revision range` 로 죽는다 —
          # 그 상태로 게이트를 붙였다가 **항상 무동작·항상 초록**이 됐다(적대적 검증이 재현했다).
          # 같은 이유로 `changes` job 이 이미 `fetch-depth: 0` 을 쓴다.
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: d23400ea220cfcbcd04856cf224dc6bc1a5e2a16e6c7365a433b7737c0774c23 # linux-x64 binary
          # PR에서는 캐시를 **쓰지 않는다**(읽기는 유지). GitHub 캐시는 ref 스코프라 `refs/pull/N/merge`에
          # 저장된 툴체인 캐시는 그 PR만 읽을 수 있고, PR이 닫히면 영영 못 읽으면서 한도(10GB)만 먹는다.
          # 실측: 닫힌 PR 13개가 남긴 죽은 캐시 36개 = 4.9GB. main push는 그대로 저장해 모두가 읽는다.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # 빌드 캐시. session host 두 잡에서 실측한 형태 그대로다(복원 5초, 빌드 311→219초).
      #
      # **캐시 이름에 버전(`v2`)을 둔다.** `restore-keys` 의 마지막 줄은 해시 없는 넓은 prefix 라
      # (`zig-<os>-check-`) 키를 바꿔도 **옛 캐시를 그대로 끌어온다** — 캐시 내용이 상해서 키를 바꾸는
      # 상황에서는 그 fallback 이 정확히 원치 않는 일을 한다. 이름을 갈면 넓은 prefix 도 새 이름을 보므로
      # 옛 것과 완전히 분리된다. 옆의 `mise-v0-` 이 같은 관행이다. 다시 상하면 `v3` 로 올린다.
      #
      # **캐시 키에 `build.zig` 는 넣지 않는다.** 435KB 짜리 단일 파일이라 게이트 하나만 추가해도 바뀌고,
      # 그때마다 여섯 잡의 캐시가 **한꺼번에** 무효가 됐다(실측 2026-08-17: 엔트리 32개가 해시 두 종으로
      # 갈려 10GB 한도를 9.99GB 까지 채웠고, 그 포화는 LRU 밀어내기로 restore-key 적중을 불안정하게 한다).
      # `.zig-cache` 는 내용 주소 지정이라 `build.zig` 가 바뀌면 영향받는 산출물만 해시가 달라져 자연히
      # 다시 빌드한다 — GitHub 키까지 무효화할 이유가 없다. 의존성을 고정하는 `build.zig.zon` 과 캐시의
      # 내용을 정하는 prune 스크립트만 남긴다.
      #
      # 키 **구성**이 바뀌어도 이름은 `v2` 로 둔다. 넓은 restore-key 가 끌어오는 옛 v2 캐시는 내용이
      # 유효하므로 여기서는 그 fallback 이 바람직하다 — 이름을 올리는 것은 캐시가 **상했을** 때다.
      #
      # **캐시 키에 `tools/ci/prune-zig-cache.sh` 를 넣는다.** 그 스크립트가 저장 직전에 캐시를 잘라
      # **캐시의 내용을 정한다** — 자르는 규칙이 바뀌면 그 전에 저장된 캐시는 새 규칙과 다른 물건이다.
      # 실제로 한 번 깨졌다: prune 이 산출물(`o/`)만 지우고 매니페스트(`h/`)를 남기자 그 캐시를 복원한
      # PR 이 전부 `FileNotFound` 로 죽었고, 고치는 PR 자체도 같은 캐시를 복원해 못 고치는 교착이 됐다.
      # 키에 넣어 두면 규칙을 고치는 순간 캐시가 자동으로 무효가 되어 그 교착이 생기지 않는다.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-check-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ runner.os }}-check-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-
            zig-v2-${{ runner.os }}-check-
      - name: Run the checks the change needs
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          set -eu
          if [ "$CHANGES_RESULT" != "success" ] || [ "$CODE" = "true" ]; then
            mise run check
          elif [ "$DOCS" = "true" ]; then
            echo "문서 전용 변경 — Zig 게이트 대신 문서 드리프트와 문서 간 링크만 검사한다"
            mise run check-config-docs
            mise run check-doc-links
            # 모바일 계약 판정자도 문서를 읽는다(제목 중복·계획 표 참조·매트릭스의 낡은 숫자).
            # 여기 안 걸면 문서만 고친 PR이 그 셋을 조용히 깬다 — 위 둘과 같은 이유다.
            mise run check-mobile-contract
          else
            echo "이 job이 소유한 게이트를 건드리지 않은 변경(web 전용 등) — 실행할 검사가 없다"
          fi
      # 중간 커밋도 경계 게이트를 통과하는가. `mise run check` 는 **팁만** 보므로, 리베이스 수렴을 팁에
      # 몰아 넣으면 앞 커밋들이 빨간 채로 머지된다 — 이 저장소가 그 사고를 두 번 냈다(9 커밋이 빌드 불가,
      # 2 커밋이 게이트 실패). 규율은 `docs/project-rules.md` `## 리베이스와 머지` 이고 이것이 그 기계 절반이다.
      #
      # PR 에서만 돈다(push 는 볼 "중간" 이 없다). 코드가 안 바뀐 PR 은 위 스텝이 이미 건너뛰었으므로
      # 여기서도 건너뛴다 — 원장이 보는 파일은 전부 코드다.
      #
      # **빌드를 안 한다** — `git` 과 `zig ast-check` 로 두 서명만 본다(실측: 9 커밋 구간 2.4초).
      # 커밋마다 게이트를 돌리는 판을 만들었다가 실측이 커밋당 3분 48초로 나와 버렸다.
      # 판정자 자신을 먼저 검증한다(`changes` job 의 `changed-areas.test.sh` 와 같은 이유 — 분류가 틀리면
      # 게이트가 조용히 열린다). **`changes` job 이 아니라 여기다** — 그 job 에는 mise 가 없어 `zig` 를 못
      # 찾고, 이 테스트는 `zig ast-check` 경로를 실제로 돈다(거기 두었다가 CI 가 그것을 잡았다).
      - name: 중간 커밋 판정자 자신을 검증한다
        if: ${{ github.event_name == 'pull_request' }}
        run: sh tools/ci/per-commit-boundaries.test.sh
      - name: 중간 커밋도 경계 게이트를 통과하는가
        if: ${{ github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh tools/ci/per-commit-boundaries.sh "$BASE" "$HEAD"
      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-check-artifacts
          path: tests/artifacts/**
          if-no-files-found: warn
          retention-days: 14

  # AppSession 제품 glue는 macOS에서만 활성화된다. Ubuntu의 기본 test가 이 경로를 컴파일하지 않으므로
  # 이 PR job에서 provider 파일 무변경 계약과 16,384-row/1,000-event 탐색기 artifact를 실행한다.
  # session-host 스위트는 컴파일이 압도적으로 무거워(아래 session-host-macos-debug·-releasefast)
  # 별도 job이 병렬로 소유한다.
      - name: 저장 전에 캐시를 예산 안으로 줄인다
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sh tools/ci/prune-zig-cache.sh 3072
      - name: Save build cache (main만 — PR은 읽기만 한다)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-check-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
  file-explorer-macos:
    name: file explorer macOS product path
    needs: changes
    if: ${{ github.event.pull_request.draft != true && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    runs-on: macos-15
    # 15 → 25. AppSession 전수 스위트(아래 "Run the macOS AppSession test suite")가 붙으면서 늘렸다.
    # 실측은 웜 캐시 로컬에서 2분 29초이고, 콜드 러너는 이 모듈을 필터 없이 처음 컴파일하므로 더 든다.
    # 여유를 두되 무한정 매달리지는 않게 한다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # 빌드 캐시. session host 두 잡에서 실측한 형태 그대로다(복원 5초, 빌드 311→219초).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-file-explorer-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ runner.os }}-file-explorer-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-
            zig-v2-${{ runner.os }}-file-explorer-
      # 제품 셰이더는 런타임 컴파일(`newLibraryWithSource:`)이라 MSL 문법이 깨져도 빌드·단위 테스트·Metal
      # 계약 테스트가 전부 통과하고 앱을 띄워야만 드러난다. 수 초짜리 컴파일 스모크로 그 사각지대를 닫는다.
      - name: Compile product Metal shaders
        run: mise run macos-shader-compile-smoke
      # Session Dock의 시각 계약(스크롤 클리핑·액션 라벨·카드 밀도)은 지금까지 사람이 캡처를 눈으로
      # 확인해 왔고, 그 방식이 실제로 회귀를 놓쳤다(부분적으로 보이는 행이 "잘린" 것과 "눌린" 것을
      # 구분하지 못했다). Chrome Lab이 제품 lowering을 Metal 오프스크린으로 태운 캡처를 골든과 픽셀
      # 비교한다 — 앱 번들이 필요 없어 이 job의 비용을 늘리지 않는다.
      - name: Gate Session Dock visuals against golden images
        run: mise run macos-dock-visual-golden
      - name: Upload dock visual captures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-dock-visual-captures
          path: zig-out/maru-macos-chrome-lab
          if-no-files-found: warn
          retention-days: 14
      # 셰이핑 경로가 메모리를 새는지 실제 CoreText 로 잰다(4,000회 반복, 상한 4MB). 2026-08-18 에 4시간
      # 46분 실행으로 physical footprint 가 140GB 까지 부푼 사건의 원인이 이 층이었고, **화면에는 아무
      # 증상이 없어서** 눈으로도 다른 계약 테스트로도 잡히지 않는다. 누수 지점은 합자 OFF 분기에만 있어
      # config 기본값(ligatures=true)으로는 안 밟히므로, 프로브가 두 분기를 번갈아 태운다.
      # 여기 두는 이유: `mise run check` 는 ubuntu 라 `.m` 을 컴파일조차 하지 않는다.
      - name: Gate CoreText shaping against memory leaks
        run: mise run macos-coretext-smoke
      # 위 스모크의 판정은 summary 필드가 존재할 때만 의미가 있다. 그 필드들을 고정하는 계약 테스트가
      # CI 어디에서도 안 돌면, 필드를 지우는 변경이 스모크를 **통과시키면서** 게이트만 조용히 없앤다.
      - name: Pin the CoreText smoke summary contract
        run: mise run test-macos-coretext-smoke
      - name: Upload CoreText smoke artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-coretext-smoke-artifacts
          path: zig-out/maru-macos-coretext-smoke
          if-no-files-found: warn
          retention-days: 14
      - name: Verify provider continuity removal
        run: mise run test-provider-session-removal
      - run: mise run macos-file-explorer-perf
      - name: Upload file explorer performance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-file-explorer-macos-artifacts
          path: tests/artifacts/perf/file-explorer.txt
          if-no-files-found: error
          retention-days: 14
      # 위 두 스텝(provider·file-explorer)은 **이름 필터로 고른 몇 개**만 돈다. 그래서 지금까지
      # `app_session.zig`의 나머지 판정자는 CI 어디에서도 실행되지 않았다 — 그 파일의 test 755개 중
      # 639개(84%)가 `builtin.os.tag != .macos`면 SkipZigTest이고, `mise run check`를 도는 check job은
      # ubuntu다. 즉 회귀 그물의 대부분이 개발자 로컬 macOS에만 있었다.
      #
      # 이 스텝이 그 공백을 닫는다. 같은 모듈(app_host_abi)을 필터 없이 통째로 돌려
      # `app_session.test.*` 754개 중 751개가 실제로 실행된다(로컬 macOS 실측, SKIP 3개는 별도 게이트가
      # 소유한 경로). 필터 스텝을 대체하지 않고 **추가**한다 — 그 둘은 탐색기·provider 신호가 무관한
      # socket/WebKit flaky에 묻히지 않게 격리하는 전용 게이트이고(위 주석), 이 스텝은 전수 그물이다.
      - name: Run the macOS AppSession test suite
        run: mise run test-macos-app-host-abi

  # session-host live-upgrade fixture는 macOS에서만 활성화되고, Debug와 ReleaseFast는 서로 다른 결함을
  # 잡는 독립 컴파일이다(Debug는 safety check, ReleaseFast는 no-fail 경로). 둘을 한 job에 직렬로 두면
  # 콜드 러너에서 합계가 11분을 넘어 CI 전체 wall-clock을 이 job 하나가 결정했다. 두 job으로 병렬
  # 실행해 wall-clock을 둘 중 느린 쪽으로 낮춘다(총 러너 시간은 동일). 서로 독립 job이라 한쪽이
  # 깨져도 다른 쪽 결과를 볼 수 있다 — 회귀가 safety check인지 최적화 의존인지 한 번에 가려낸다.
  #
  # **matrix가 아니라 명시 job 두 개인 이유**: matrix job이 조건으로 skip되면 GitHub은 확장 전
  # 이름(`session host macOS (${{ matrix.optimize }})`)으로 **한 번만** 보고한다. required 컨텍스트인
  # `session host macOS (Debug)`·`(ReleaseFast)`는 그 run에 아예 나타나지 않아, 코드가 안 바뀐 PR이
  # 두 컨텍스트 pending으로 영구 BLOCKED된다(2026-08-03 PR #1823에서 실측). 이름을 리터럴로 고정하면
  # skip될 때도 그 이름 그대로 conclusion=skipped가 보고돼 branch protection이 통과로 본다.
  # 두 job의 유일한 차이는 `-Doptimize`다 — 한쪽을 고치면 다른 쪽도 같이 고친다.
      - name: 저장 전에 캐시를 예산 안으로 줄인다
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sh tools/ci/prune-zig-cache.sh 3072
      - name: Save build cache (main만 — PR은 읽기만 한다)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-file-explorer-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
  session-host-macos-debug:
    name: session host macOS (Debug)
    needs: changes
    if: ${{ github.event.pull_request.draft != true && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Zig 빌드 캐시. **실측**(로컬, session host Debug): 콜드 243초 → 웜 156초(-36%),
      # 캐시 크기 local 607MB + global 48MB. 그 절감분을 655MB 전송이 먹을 수 있어 **가장 무거운 두 잡에만**
      # 먼저 넣고 실제 효과를 본 뒤 확대한다(무작정 5개 잡에 붙이면 저장소 10GB 한도에서 서로 밀어낸다).
      #
      # **복원은 항상, 저장은 main push에서만** 한다. PR마다 저장하면 캐시가 churn해 적중률이 오히려 떨어진다 —
      # PR은 main이 남긴 캐시로 시작하고 쓰지는 않는다.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: zig-cache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-sessionhost-debug-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ runner.os }}-sessionhost-debug-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-
            zig-v2-${{ runner.os }}-sessionhost-debug-
      - name: Verify session host and live-upgrade fixtures
        run: zig build test-session-host -Doptimize=Debug
      - name: 저장 전에 캐시를 예산 안으로 줄인다
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sh tools/ci/prune-zig-cache.sh 3072
      - name: Save Zig cache (main만 — PR은 읽기만 한다)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-sessionhost-debug-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}

  # P5d는 ReleaseFast 앱 번들과 localhost OpenSSH 제품 E2E를 다시 컴파일한다. Debug 전수 스위트 뒤에
  # 직렬로 붙이면 콜드 macOS runner에서 20분 job 상한을 넘겨 성공한 앞 단계까지 cancelled로 잃는다.
  # 별도 required job으로 병렬 실행해 두 gate의 실패/시간 예산을 독립적으로 판정한다.
  session-host-bundled-cli-macos:
    name: session host bundled CLI macOS
    needs: changes
    if: ${{ github.event.pull_request.draft != true && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
          cache_save: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-sessionhost-releasefast-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ runner.os }}-sessionhost-releasefast-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-
            zig-v2-${{ runner.os }}-sessionhost-releasefast-
      - name: Install web bundle dependencies for the signed CLI fixture
        run: bun install --cwd web --frozen-lockfile
      - name: Verify bundled CLI over harness-owned localhost OpenSSH
        run: zig build test-session-host-p5d -Doptimize=ReleaseFast -j1

  session-host-keepalive-macos:
    name: keep-alive recovered session macOS
    needs: changes
    # **keep-alive 를 실제로 켜고 도는 유일한 CI 잡이다.** `session.keep-alive-after-quit = true` 인 홈에서
    # 앱을 두 번 띄워, 1차가 남긴 host runtime 을 2차가 목록에서 찾아 클릭하고 그 원격 터미널을 세운 뒤,
    # 1차 셸이 남긴 표식이 보이는지까지 본다 — 즉 「GUI 를 껐다 켜도 **같은 프로세스**에 다시 붙는다」는
    # keep-alive 의 핵심 계약을 실 AppKit 창으로 end-to-end 검증한다.
    #
    # **오래 «CI 에서 못 돈다» 고 적혀 있었는데 시도한 적이 없었다**(`macos-app-smoke`·`window-smoke` 는
    # ci.yml 이력에 없다). 실제로 재 보니 러너에 WindowServer 가 살아 있고(pid 145) 이 스모크가 통과한다.
    # 실측 **2분 14초**로 macOS 잡 중 가장 싸다(slow observer 1m46s, bundled CLI 7m09s, Debug 8m01s,
    # file explorer 14m04s) — 병렬이라 wall-clock 영향도 사실상 없다.
    #
    # 복구 스모크는 **정상 종료 → 재실행 → 재접속**을, R1 스모크는 ended checkpoint를 두 번 게시한 뒤의
    # **SIGKILL → 재실행**을 덮는다. live runtime이 있는 최신 멀티 윈도우 checkpoint 강제 종료 복원(R7)·
    # GUI 부재 중 알림(OS 배너)은 여전히 덮지 않는다.
    if: ${{ github.event.pull_request.draft != true && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
          cache_save: false
      # 앱 번들 빌드가 `web:build` 를 타므로 웹 의존성이 먼저 있어야 한다 — 이걸 빠뜨린 첫 시도가
      # `unresolved_import` 로 죽었다(AppKit 과 무관한 실패였다). 기존 web job 과 같은 명령을 쓴다.
      - name: 웹 의존성 설치
        run: bun install --cwd web --frozen-lockfile
      # 이 스모크가 단언하는 일곱(build.zig): stage=2(두 번째 실행까지 감) · row_present(살아남은 세션을
      # 목록에서 찾음) · click_dispatched(실제 클릭) · remote_published(원격 터미널이 섬) ·
      # marker_present(**1 차 셸이 남긴 표식이 2 차에서 보임 = 같은 프로세스에 재접속**) · before/after_capture
      # (그 화면을 렌더해 캡처).
      - name: keep-alive recovered-session 스모크
        run: mise run macos-session-host-recovery-smoke
      # 저장된 ended tombstone을 실제 AppKit 제품이 capture→atomic checkpoint한 결과로 다시 두 번
      # 띄운다. 두 실행 모두 셸 child 0이어야 하므로 unit의 restoreSpawn sentinel보다 강한 제품 경계다.
      - name: durable tombstone 다회 재실행 스모크
        run: mise run macos-session-host-r1-tombstone-smoke

  session-host-macos-releasefast:
    name: session host macOS (ReleaseFast)
    needs: changes
    # **자동으로는 돌지 않는다 — `workflow_dispatch` 수동 실행 전용이다.** Debug와 같은 테스트를 도는 게
    # 아니라 *다른 실행 체제*다: ReleaseFast는 런타임 안전 검사가 꺼져 Debug가 트랩하던 UB가 진짜 UB가
