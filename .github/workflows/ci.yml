          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Zig 빌드 캐시. **실측**(로컬, session host Debug): 콜드 243초 → 웜 156초(-36%),
      # 캐시 크기 local 607MB + global 48MB. 그 절감분을 655MB 전송이 먹을 수 있어 **가장 무거운 두 잡에만**
      # 먼저 넣고 실제 효과를 본 뒤 확대한다(무작정 5개 잡에 붙이면 저장소 10GB 한도에서 서로 밀어낸다).
      #
      # **복원은 항상, 저장은 main push에서만** 한다. PR마다 저장하면 캐시가 churn해 적중률이 오히려 떨어진다 —
      # PR은 main이 남긴 캐시로 시작하고 쓰지는 않는다.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: zig-cache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-sessionhost-releasefast-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ runner.os }}-sessionhost-releasefast-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-
            zig-v2-${{ runner.os }}-sessionhost-releasefast-
      - name: Verify session host and live-upgrade fixtures
