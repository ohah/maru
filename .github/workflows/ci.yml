      - name: Upload session-host slow-observer artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-session-host-slow-observer-macos-artifact
          path: tests/artifacts/perf/session-host-slow-observer-macos.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload CR6e stalled-peer baseline artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-session-host-cr6e-baseline-macos-artifact
          path: tests/artifacts/perf/session-host-cr6e-baseline-macos.json
          if-no-files-found: error
          retention-days: 14

  # 외부 reference 오라클(opt-in). 손으로 기록한 golden을 실제 VT 구현과 대조한다.
  # CI에서는 설치가 가벼운 libvterm(apt)과 Alacritty(runner 기본 Rust)만 돌린다.
  # Ghostty libghostty-vt 오라클은 Zig 0.15.2 + 무거운 Ghostty 빌드가 필요해
  # 기본 CI에서 제외한다(로컬에서 `mise run oracle-ghostty`).
      - name: 저장 전에 캐시를 예산 안으로 줄인다
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sh tools/ci/prune-zig-cache.sh 3072
      - name: Save build cache (main만 — PR은 읽기만 한다)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-v2-${{ runner.os }}-slow-observer-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
  oracles:
    name: external oracles (libvterm, Alacritty)
    needs: changes
    if: ${{ github.event.pull_request.draft != true && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: d23400ea220cfcbcd04856cf224dc6bc1a5e2a16e6c7365a433b7737c0774c23 # linux-x64 binary
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # 빌드 캐시. session host 두 잡에서 실측한 형태 그대로다(복원 5초, 빌드 311→219초).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            ~/.cargo/registry
            ~/.cargo/git
            tests/oracle/alacritty-dumper/target
          key: zig-v2-${{ runner.os }}-oracles-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
          restore-keys: |
            zig-v2-${{ runner.os }}-oracles-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-
            zig-v2-${{ runner.os }}-oracles-

      - name: Install libvterm
        run: sudo apt-get update && sudo apt-get install -y libvterm-dev

      - name: libvterm oracle
        run: mise run oracle-ext

      - name: Build Alacritty dumper
        run: cargo build --release --manifest-path tests/oracle/alacritty-dumper/Cargo.toml

      - name: Alacritty oracle
        run: mise run oracle-alacritty
      - name: Upload external oracle artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-external-oracle-artifacts
          path: tests/artifacts/**
          if-no-files-found: warn
          retention-days: 14
      - name: 저장 전에 캐시를 예산 안으로 줄인다
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: sh tools/ci/prune-zig-cache.sh 3072
      - name: Save build cache (main만 — PR은 읽기만 한다)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            ~/.cargo/registry
            ~/.cargo/git
            tests/oracle/alacritty-dumper/target
          key: zig-v2-${{ runner.os }}-oracles-${{ hashFiles('build.zig.zon', 'tools/ci/prune-zig-cache.sh') }}-${{ github.sha }}
