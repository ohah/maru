    # ⚠️ 이 잡은 branch protection의 필수 체크가 **아니다**(PR에서 안 돌던 때 함께 뺐다). 필수인데
    # 실행되지 않으면 PR이 영영 pending으로 막히므로, 다시 필수로 올리려면 실행 조건부터 되돌려야 한다.
