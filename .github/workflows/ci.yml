name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 ref에서 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 변경 영역 판정. 문서만 고친 PR에서 macOS 러너 4대와 외부 오라클까지 도는 것은 순수한 낭비다.
  # 분류 정책의 단일 출처는 tools/ci/changed-areas.sh이고, 아래 job들은 그 플래그만 소비한다.
  #
  # workflow-level `paths` 필터가 아니라 job-level `if`인 이유: required 워크플로에 `paths`를 두면
  # 무관한 PR에서 트리거 자체가 안 돼 required 컨텍스트가 영원히 pending으로 머지를 막는다. 반면
  # 조건으로 건너뛴 job은 conclusion=skipped로 보고되고 branch protection은 이를 통과로 취급한다.
  # 필수 체크 목록의 단일 출처는 docs/performance-budget.md "필수 CI 체크"다.
  #
  # 이 job은 required 컨텍스트가 아니다. 실패하면 소비 job들이 `needs.changes.result != 'success'`
  # 로 fail-safe 실행되므로, 판정이 없을 때 게이트가 조용히 열리지 않는다.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      web: ${{ steps.areas.outputs.web }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      # three-dot diff에 merge-base가 필요해 전체 히스토리를 받는다(얕은 클론은 base.sha가 없다).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # 분류가 틀리면 게이트가 조용히 열린다. 판정을 쓰기 전에 분류기 자신을 먼저 검증한다
      # (순수 sh라 수 초). web.yml·performance.yml은 같은 스크립트를 쓰므로 여기서 한 번만 돈다.
      - run: sh tools/ci/changed-areas.test.sh
      - id: areas
        # push(main)에서는 두 값이 비어 전 영역 실행으로 떨어진다 — main은 항상 전부 검증한다.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh tools/ci/changed-areas.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  # 기본 게이트: fmt-check, unit, e2e, recorded oracle, stress, facade import 경계와 build를
  # 한 번에 검증한다. SVG hash/C·Zig registry는 외부 도구 없이 Zig test가 검증한다.
  #
  # 이 job만 조건부 skip이 아니라 **항상 실행**하고 안에서 범위를 줄인다. check-config-docs가
  # docs/*.md를 런타임에 훑는 게이트라(tests/config_docs/keys.zig) 문서만 바뀐 PR에서도 실행돼야
  # 한다 — 문서가 없는 config 키를 설정처럼 소개하는 드리프트는 이 검사만 잡는다. web만 바뀐 PR은
  # 검사할 것이 없어 즉시 통과한다(Zig 툴체인조차 세우지 않는다).
  check:
    name: check
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: d23400ea220cfcbcd04856cf224dc6bc1a5e2a16e6c7365a433b7737c0774c23 # linux-x64 binary
      - name: Run the checks the change needs
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          set -eu
          if [ "$CHANGES_RESULT" != "success" ] || [ "$CODE" = "true" ]; then
            mise run check
          elif [ "$DOCS" = "true" ]; then
            echo "문서 전용 변경 — Zig 게이트 대신 config 문서 드리프트만 검사한다"
            mise run check-config-docs
          else
            echo "이 job이 소유한 게이트를 건드리지 않은 변경(web 전용 등) — 실행할 검사가 없다"
          fi
      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-check-artifacts
          path: tests/artifacts/**
          if-no-files-found: warn
          retention-days: 14

  # AppSession 제품 glue는 macOS에서만 활성화된다. Ubuntu의 기본 test가 이 경로를 컴파일하지 않으므로
  # 이 PR job에서 provider 파일 무변경 계약과 16,384-row/1,000-event 탐색기 artifact를 실행한다.
  # session-host 스위트는 컴파일이 압도적으로 무거워(아래 session-host-macos-debug·-releasefast)
  # 별도 job이 병렬로 소유한다.
  file-explorer-macos:
    name: file explorer macOS product path
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
      # 제품 셰이더는 런타임 컴파일(`newLibraryWithSource:`)이라 MSL 문법이 깨져도 빌드·단위 테스트·Metal
      # 계약 테스트가 전부 통과하고 앱을 띄워야만 드러난다. 수 초짜리 컴파일 스모크로 그 사각지대를 닫는다.
      - name: Compile product Metal shaders
        run: mise run macos-shader-compile-smoke
      # Session Dock의 시각 계약(스크롤 클리핑·액션 라벨·카드 밀도)은 지금까지 사람이 캡처를 눈으로
      # 확인해 왔고, 그 방식이 실제로 회귀를 놓쳤다(부분적으로 보이는 행이 "잘린" 것과 "눌린" 것을
      # 구분하지 못했다). Chrome Lab이 제품 lowering을 Metal 오프스크린으로 태운 캡처를 골든과 픽셀
      # 비교한다 — 앱 번들이 필요 없어 이 job의 비용을 늘리지 않는다.
      - name: Gate Session Dock visuals against golden images
        run: mise run macos-dock-visual-golden
      - name: Upload dock visual captures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-dock-visual-captures
          path: zig-out/maru-macos-chrome-lab
          if-no-files-found: warn
          retention-days: 14
      - name: Verify provider continuity removal
        run: mise run test-provider-session-removal
      - run: mise run macos-file-explorer-perf
      - name: Upload file explorer performance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-file-explorer-macos-artifacts
          path: tests/artifacts/perf/file-explorer.txt
          if-no-files-found: error
          retention-days: 14

  # session-host live-upgrade fixture는 macOS에서만 활성화되고, Debug와 ReleaseFast는 서로 다른 결함을
  # 잡는 독립 컴파일이다(Debug는 safety check, ReleaseFast는 no-fail 경로). 둘을 한 job에 직렬로 두면
  # 콜드 러너에서 합계가 11분을 넘어 CI 전체 wall-clock을 이 job 하나가 결정했다. 두 job으로 병렬
  # 실행해 wall-clock을 둘 중 느린 쪽으로 낮춘다(총 러너 시간은 동일). 서로 독립 job이라 한쪽이
  # 깨져도 다른 쪽 결과를 볼 수 있다 — 회귀가 safety check인지 최적화 의존인지 한 번에 가려낸다.
  #
  # **matrix가 아니라 명시 job 두 개인 이유**: matrix job이 조건으로 skip되면 GitHub은 확장 전
  # 이름(`session host macOS (${{ matrix.optimize }})`)으로 **한 번만** 보고한다. required 컨텍스트인
  # `session host macOS (Debug)`·`(ReleaseFast)`는 그 run에 아예 나타나지 않아, 코드가 안 바뀐 PR이
  # 두 컨텍스트 pending으로 영구 BLOCKED된다(2026-08-03 PR #1823에서 실측). 이름을 리터럴로 고정하면
  # skip될 때도 그 이름 그대로 conclusion=skipped가 보고돼 branch protection이 통과로 본다.
  # 두 job의 유일한 차이는 `-Doptimize`다 — 한쪽을 고치면 다른 쪽도 같이 고친다.
  session-host-macos-debug:
    name: session host macOS (Debug)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
      # Zig 빌드 캐시. **실측**(로컬, session host Debug): 콜드 243초 → 웜 156초(-36%),
      # 캐시 크기 local 607MB + global 48MB. 그 절감분을 655MB 전송이 먹을 수 있어 **가장 무거운 두 잡에만**
      # 먼저 넣고 실제 효과를 본 뒤 확대한다(무작정 5개 잡에 붙이면 저장소 10GB 한도에서 서로 밀어낸다).
      #
      # **복원은 항상, 저장은 main push에서만** 한다. PR마다 저장하면 캐시가 churn해 적중률이 오히려 떨어진다 —
      # PR은 main이 남긴 캐시로 시작하고 쓰지는 않는다.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: zig-cache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-sessionhost-debug-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-sessionhost-debug-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-sessionhost-debug-
      - name: Verify session host and live-upgrade fixtures
        run: zig build test-session-host -Doptimize=Debug
      - name: Save Zig cache (main만 — PR은 읽기만 한다)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-sessionhost-debug-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}

  session-host-macos-releasefast:
    name: session host macOS (ReleaseFast)
    needs: changes
    # **PR에서는 안 돈다 — main push에서만.** Debug와 같은 테스트를 도는 게 아니라 *다른 실행 체제*다:
    # ReleaseFast는 런타임 안전 검사가 꺼져 Debug가 트랩하던 UB가 진짜 UB가 되고, 코드가 빨라져
    # fork/exec·소켓·스레딩의 인터리빙도 달라진다. 그래서 없앨 수 없고 **시점만 뒤로 옮긴다**.
    #
    # 대가는 명시적이다: PR이 초록이어도 머지 뒤 이 잡이 빨개질 수 있다. 대신 PR마다 8분을 돌려받는다
    # (실측: 잡 8개 합계 24분 46초 중 이 잡 하나가 8분 14초).
    # ⚠️ 이 잡은 branch protection의 **필수 체크**였다 — PR에서 안 돌게 하려면 그 목록에서도 빼야 한다
    # (필수인데 실행되지 않으면 PR이 영영 pending으로 막힌다). 이 PR과 함께 설정을 바꾼다.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
      # Zig 빌드 캐시. **실측**(로컬, session host Debug): 콜드 243초 → 웜 156초(-36%),
      # 캐시 크기 local 607MB + global 48MB. 그 절감분을 655MB 전송이 먹을 수 있어 **가장 무거운 두 잡에만**
      # 먼저 넣고 실제 효과를 본 뒤 확대한다(무작정 5개 잡에 붙이면 저장소 10GB 한도에서 서로 밀어낸다).
      #
      # **복원은 항상, 저장은 main push에서만** 한다. PR마다 저장하면 캐시가 churn해 적중률이 오히려 떨어진다 —
      # PR은 main이 남긴 캐시로 시작하고 쓰지는 않는다.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: zig-cache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-sessionhost-releasefast-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-sessionhost-releasefast-${{ hashFiles('build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-sessionhost-releasefast-
      - name: Verify session host and live-upgrade fixtures
        run: zig build test-session-host -Doptimize=ReleaseFast
      - name: Save Zig cache (main만 — PR은 읽기만 한다)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-sessionhost-releasefast-${{ hashFiles('build.zig', 'build.zig.zon') }}-${{ github.sha }}

  # Mermaid 제품 pump는 macOS helper/WKWebView와 native tick adapter가 모두 필요하다.
  # 1,000 tick artifact가 process/pipe/wait 0과 completion drain 상한을 어기면 merge하지 않는다.
  #
  # web/**도 트리거다 — 이 job은 `web/dist/mermaid-helper.js`를 빌드해 소비하므로 web 변경이
  # 제품 pump를 깨뜨릴 수 있다(build.zig의 mermaid digest/helper 복사 경로).
  mermaid-macos:
    name: mermaid macOS product path
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
      - run: bun install --cwd web --frozen-lockfile
      - run: mise run macos-mermaid-perf
      - name: Upload native Mermaid performance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-mermaid-macos-artifacts
          path: |
            tests/artifacts/perf/mermaid-macos.json
            zig-out/maru-macos-mermaid-helper-smoke/mermaid-helper.summary.json
          if-no-files-found: error
          retention-days: 14

  # P5b2b2: Debug test runner나 ru_maxrss가 아니라 독립 ReleaseFast session-host PID의
  # 실제 forkpty/3-client backpressure와 현재 RSS를 구조화 artifact로 판정한다.
  session-host-slow-observer-macos:
    name: session host slow observer macOS
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: f8becf318705e1bd91227ed0efee4f9fd988d1d5c66bb48e996f030792a0d3b7 # macos-arm64 binary
      - name: Verify real PTY slow-observer isolation and host RSS
        run: zig build test-session-host-slow-observer-macos
      - name: Upload session-host slow-observer artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-session-host-slow-observer-macos-artifact
          path: tests/artifacts/perf/session-host-slow-observer-macos.json
          if-no-files-found: error
          retention-days: 14

  # 외부 reference 오라클(opt-in). 손으로 기록한 golden을 실제 VT 구현과 대조한다.
  # CI에서는 설치가 가벼운 libvterm(apt)과 Alacritty(runner 기본 Rust)만 돌린다.
  # Ghostty libghostty-vt 오라클은 Zig 0.15.2 + 무거운 Ghostty 빌드가 필요해
  # 기본 CI에서 제외한다(로컬에서 `mise run oracle-ghostty`).
  oracles:
    name: external oracles (libvterm, Alacritty)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.2.7
          sha256: d23400ea220cfcbcd04856cf224dc6bc1a5e2a16e6c7365a433b7737c0774c23 # linux-x64 binary

      - name: Install libvterm
        run: sudo apt-get update && sudo apt-get install -y libvterm-dev

      - name: libvterm oracle
        run: mise run oracle-ext

      - name: Build Alacritty dumper
        run: cargo build --release --manifest-path tests/oracle/alacritty-dumper/Cargo.toml

      - name: Alacritty oracle
        run: mise run oracle-alacritty
      - name: Upload external oracle artifacts
        if: always()
