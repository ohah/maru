name: Performance

on:
  workflow_dispatch:
  schedule:
    # 주간 성능 추적용이다. KST 월요일 새벽에 실행되도록 UTC 일요일에 둔다.
    - cron: "0 18 * * 0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/performance.yml"
      - ".mise.toml"
      - "build.zig"
      - "src/**"
      - "tests/**"
      - "tools/perf/**"
  # 트리거는 모든 PR에 열어 둔다(paths 필터를 두면 무관한 PR에서 워크플로가 아예 안 돌아 required
  # 체크가 영원히 pending으로 머지를 막는다). perf job은 ~30s로 짧다. 이번 reflow perf 회귀가 PR
  # 체크에 없어 main에 들어간 일을 막기 위함이다. 코드가 안 바뀐 PR은 아래 job이 건너뛴다 —
  # 조건으로 skip된 job은 required 컨텍스트에서 통과로 보고된다.
  # draft 를 푸는 순간을 잡으려면 ready_for_review 가 필요하다 — 기본 types 에는 없어서
  # 그 전환에 아무 이벤트도 안 오고, draft 동안 건너뛴 job 이 영영 안 돈다.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 같은 ref·같은 트리거에서 새 실행이 오면 이전 실행만 취소한다. group에
# event_name을 포함하지 않으면 main push가 진행 중인 주간 schedule 실행을
# 같은 group으로 취소해, 정기 추적이라는 schedule 본래 목적이 깨진다.
concurrency:
  group: perf-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # 분류 정책의 단일 출처는 tools/ci/changed-areas.sh다(ci.yml의 같은 job과 동일한 계약).
  # schedule/workflow_dispatch/push에서는 base/head가 비어 전 영역 실행으로 떨어진다.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.areas.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh tools/ci/changed-areas.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  core-performance-budget:
    name: core performance budget
    needs: changes
    if: ${{ github.event.pull_request.draft != true && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # PR에서는 캐시를 **쓰지 않는다**(읽기는 유지). GitHub 캐시는 ref 스코프라 `refs/pull/N/merge`에
          # 저장된 툴체인 캐시는 그 PR만 읽을 수 있고, PR이 닫히면 영영 못 읽으면서 한도(10GB)만 먹는다.
          # 실측: 닫힌 PR 13개가 남긴 죽은 캐시 36개 = 4.9GB. main push는 그대로 저장해 모두가 읽는다.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: mise run perf
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maru-performance-artifacts
          path: tests/artifacts/perf/**
          if-no-files-found: warn
          retention-days: 30
