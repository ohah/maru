name: Performance

on:
  workflow_dispatch:
  schedule:
    # 주간 성능 추적용이다. KST 월요일 새벽에 실행되도록 UTC 일요일에 둔다.
    - cron: "0 18 * * 0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/performance.yml"
      - ".mise.toml"
      - "build.zig"
      - "src/**"
      - "tests/**"
      - "tools/perf/**"
  # PR 필수 체크로 쓰므로 모든 PR에서 돈다(paths 필터를 두면 무관한 PR에서 skip돼 required 체크가
  # 영원히 pending으로 머지를 막는다). perf job은 ~30s로 짧다. 이번 reflow perf 회귀가 PR 체크에
  # 없어 main에 들어간 일을 막기 위함이다.
  pull_request:

# 같은 ref·같은 트리거에서 새 실행이 오면 이전 실행만 취소한다. group에
# event_name을 포함하지 않으면 main push가 진행 중인 주간 schedule 실행을
# 같은 group으로 취소해, 정기 추적이라는 schedule 본래 목적이 깨진다.
concurrency:
  group: perf-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core-performance-budget:
    name: core performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run perf
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maru-performance-artifacts
          path: tests/artifacts/perf/**
          if-no-files-found: warn
          retention-days: 30
