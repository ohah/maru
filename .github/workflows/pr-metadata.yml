name: PR metadata

# 필수 PR 메타데이터(라벨 1개 이상 + assignee=ohah)를 강제한다.
# 규칙의 단일 출처는 docs/pr-checklist.md다. 기본 `pull_request` 트리거(ci.yml)는
# labeled/assigned 이벤트로 돌지 않으므로, 라벨/assignee가 바뀔 때 메타데이터를
# 재평가하려면 그 이벤트들을 명시한 별도 워크플로우가 필요하다. synchronize도 넣어
# 새 커밋(새 head SHA)마다 결과가 남게 한다.
# 주의: 이 체크가 실제로 머지를 막으려면 branch protection의 required check로 지정해야 한다.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, assigned, unassigned]

# concurrency(취소)는 의도적으로 두지 않는다. 이 job은 branch protection의 **required 체크**
# (`require label and assignee=ohah`)다. PR 생성 시 opened + labeled(라벨 수만큼) + assigned가 같은
# head SHA에서 거의 동시에 터져 run이 여러 개 생기는데, concurrency로 묶으면 — cancel-in-progress가
# true든 false든 — GitHub이 형제/중간 pending run을 **취소**하고, 취소된 run은 required 컨텍스트를
# head SHA에 conclusion=CANCELLED로 남긴다. branch protection은 required 체크의 최신 결과가 CANCELLED면
# 형제 run이 SUCCESS여도 머지를 BLOCKED 처리한다 → "체크 전부 green인데 머지 안 됨"이 반복됐다.
# 그래서 묶지 않고 모든 run을 끝까지 돌린다: 이 job은 현재 PR 상태를 읽는 5초 read-only·idempotent라
# 중복 실행이 싸고 전부 SUCCESS로 끝난다. 러너가 포화면 중복 run은 queued(=pending)로 대기할 뿐이고
# auto-merge는 pending을 기다렸다 머지하므로 잠깐 지연될 뿐 영구 BLOCK이 아니다(취소보다 안전).
# 참고: ci.yml·performance.yml은 concurrency를 쓰지만 group이 ref 기준이라 취소가 항상 "이전 커밋"
# (cross-SHA) 대상 → 최종 head SHA엔 취소 체크를 안 남겨 이 위험이 없다. labeled/assigned로 같은 SHA
# 버스트가 나는 이 워크플로만 해당된다.

permissions:
  pull-requests: read

jobs:
  require-label-and-assignee:
    name: require label and assignee=ohah
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR has a label and is assigned to ohah
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          assignees=$(gh pr view "$PR" --repo "$REPO" --json assignees -q '.assignees[].login')
          fail=0
          if [ -z "$labels" ]; then
            echo "::error::PR must have at least one label (see docs/pr-checklist.md)"
            fail=1
          fi
          if ! printf '%s\n' "$assignees" | grep -qx 'ohah'; then
            echo "::error::PR must be assigned to ohah (gh pr edit $PR --add-assignee ohah)"
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "ok: labels=[$(echo "$labels" | tr '\n' ' ')] assignees=[$(echo "$assignees" | tr '\n' ' ')]"
          fi
          exit "$fail"
