name: Release

# 배포 플로우(docs/distribution.md "CI 릴리스"). 태그 푸시(v*) 시 universal(arm64+x86_64)
# .dmg를 서명·공증·staple한 뒤 새 draft에서 재다운로드 검증하고 GitHub Release로 publish한다. 실제 배포는 아래 Secret 세팅 + 태그 푸시가
# 있어야 동작한다(없으면 인증서 import 단계에서 멈춘다 — 의도된 가드). 서명 Secret을 caller가 고른 임의 ref에
# 노출하지 않도록 수동 실행은 제공하지 않는다.
#
# 필요한 Secret (Settings > Secrets and variables > Actions):
#   MACOS_CERT_P12              Developer ID Application 인증서 .p12 를 base64 인코딩한 값
#   MACOS_CERT_PASSWORD         위 .p12 의 비밀번호
#   KEYCHAIN_PASSWORD           CI 임시 키체인 잠금 비번(아무 값, 이 잡에서만 씀)
#   APPLE_ID                    공증용 Apple 계정 이메일
#   APPLE_TEAM_ID               팀 ID (10자 영숫자)
#   APPLE_APP_SPECIFIC_PASSWORD 공증용 앱 전용 암호
# 비밀값은 리포에 두지 않는다 — 모두 Secret으로 주입한다(distribution.md "서명·공증").

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-dmg:
    name: universal dmg (signed + notarized)
    environment: release
    permissions:
      contents: write # GitHub Release 생성/업로드
      id-token: write # artifact attestation OIDC
      attestations: write # artifact attestation publication
    # Apple Silicon — arm64 네이티브 + x86_64 cross.
    runs-on: macos-15
    steps:
      # Repository bytes가 PATH나 executable digest를 바꾸기 전에 runner-provided gh를 고정한다.
      # 후속 validator는 환경변수나 PATH를 다시 읽지 않고 이 step output만 argv로 소비한다.
      - name: Capture trusted GitHub CLI before checkout
        id: trusted-gh
        shell: bash
        run: |
          set -euo pipefail
          discovered=$(command -v gh)
          canonical=$(/usr/bin/realpath "$discovered")
          case "$canonical" in
            /*) ;;
            *) exit 1 ;;
          esac
          [[ "$canonical" != *$'\n'* && "$canonical" != *$'\r'* ]]
          test "$(/usr/bin/stat -f '%HT' "$canonical")" = 'Regular File'
          test -x "$canonical"
          sha256=$(/usr/bin/shasum -a 256 "$canonical" | /usr/bin/awk '{print $1}')
          case "$sha256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#sha256}" = 64
          printf 'path=%s\n' "$canonical" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2, .mise.toml 의 zig 0.16
        with:
          # PR에서는 캐시를 **쓰지 않는다**(읽기는 유지). GitHub 캐시는 ref 스코프라 `refs/pull/N/merge`에
          # 저장된 툴체인 캐시는 그 PR만 읽을 수 있고, PR이 닫히면 영영 못 읽으면서 한도(10GB)만 먹는다.
          # 실측: 닫힌 PR 13개가 남긴 죽은 캐시 36개 = 4.9GB. main push는 그대로 저장해 모두가 읽는다.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The protected tag source selects the mise version. Capture its pathname object now so the
      # later baseline runner can reject any toolchain drift around child execution.
      - name: Capture trusted Zig toolchain after mise
        id: trusted-zig
        shell: bash
        run: |
          set -euo pipefail
          discovered=$(command -v zig)
          canonical=$(/usr/bin/realpath "$discovered")
          case "$canonical" in
            /*) ;;
            *) exit 1 ;;
          esac
          [[ "$canonical" != *$'\n'* && "$canonical" != *$'\r'* ]]
          test "$(/usr/bin/stat -f '%HT' "$canonical")" = 'Regular File'
          test -x "$canonical"
          version=$("$canonical" version)
          test "$version" = '0.16.0'
          size=$(/usr/bin/stat -f '%z' "$canonical")
          case "$size" in
            ''|0|*[!0-9]*) exit 1 ;;
          esac
          sha256=$(/usr/bin/shasum -a 256 "$canonical" | /usr/bin/awk '{print $1}')
          case "$sha256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#sha256}" = 64
          printf 'path=%s\n' "$canonical" >> "$GITHUB_OUTPUT"
          printf 'size=%s\n' "$size" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - name: Verify release version SSOT
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          TRUSTED_ZIG: ${{ steps.trusted-zig.outputs.path }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            "$TRUSTED_ZIG" build check-release-version -Drelease-tag="$RELEASE_TAG"
          else
            "$TRUSTED_ZIG" build check-release-version
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/maru-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # codesign이 키 접근 시 UI 프롬프트 없이 쓰도록 partition list 설정.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$kc"
          # 새 키체인을 검색 목록 맨 앞에 추가(기존 목록 보존) — codesign이 인증서를 찾게 한다.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # 로컬과 동일한 프로파일 이름(maru-notary)으로 저장 → 빌드 스크립트를 그대로 재사용한다.
          xcrun notarytool store-credentials maru-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build signed + notarized universal dmg
        env:
          ZIG: ${{ steps.trusted-zig.outputs.path }}
        run: sh tools/build-macos-universal-dmg.sh

      - name: Build session host live release executables
        env:
          TRUSTED_ZIG: ${{ steps.trusted-zig.outputs.path }}
        run: |
          set -euo pipefail
          "$TRUSTED_ZIG" build \
            session-host-release-validator \
            session-host-release-workflow-bootstrap \
            session-host-release-workflow-candidate-inputs \
            session-host-release-p5d-candidate \
            session-host-release-workflow-checkpoint \
            session-host-release-workflow-command \
            session-host-release-workflow-authored-selector \
            -Doptimize=ReleaseFast

      - name: Run session host live release workflow
        id: session-host-live
        env:
          MARU_SESSION_HOST_RELEASE_PROFILE_V1: ${{ vars.SESSION_HOST_RELEASE_PROFILE_V1 }}
        uses: ./.github/actions/session-host-release-live
        with:
          gh-path: ${{ steps.trusted-gh.outputs.path }}
          gh-sha256: ${{ steps.trusted-gh.outputs.sha256 }}
          zig-path: ${{ steps.trusted-zig.outputs.path }}
          zig-size: ${{ steps.trusted-zig.outputs.size }}
          zig-sha256: ${{ steps.trusted-zig.outputs.sha256 }}

      - name: Upload dmg as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-universal-dmg-${{ github.run_attempt }}
          path: dist/session-host-candidate-*/Maru-*-universal.dmg
          if-no-files-found: error
          retention-days: 14

      # TODO(후속): Homebrew tap(ohah/homebrew-maru) cask version/sha256 자동 bump PR.
      # tap repo write 토큰이 필요해 별도로 추가한다(distribution.md "CI 릴리스" 5단계).

  session-host-tombstone-product:
    name: session host tombstone product
    needs: universal-dmg
    environment: Session host product
    runs-on: [self-hosted, macOS, ARM64, session-host-product]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Download exact-attempt signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maru-universal-dmg-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maru-session-host-tombstone-candidate-${{ github.run_attempt }}

      - name: Run mounted signed durable-tombstone transaction
        id: tombstone-product
        shell: bash
        env:
          MARU_REF_TYPE: ${{ github.ref_type }}
          MARU_TAG: ${{ github.ref_name }}
          MARU_REPOSITORY: ${{ github.repository }}
          MARU_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          test "$MARU_REF_TYPE" = tag
          test "$MARU_REPOSITORY" = ohah/maru
          [[ "$MARU_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${MARU_TAG#v}
          candidate="$RUNNER_TEMP/maru-session-host-tombstone-candidate-$MARU_ATTEMPT"
          dmg="$candidate/Maru-$version-universal.dmg"
          test "$(/usr/bin/stat -f '%HT' "$dmg")" = 'Regular File'
          test ! -L "$dmg"
          test_uuid=$(/usr/bin/uuidgen | /usr/bin/tr '[:upper:]' '[:lower:]')
          [[ "$test_uuid" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]

          compact=${test_uuid//-/}
          root="/tmp/mt-$compact"
          evidence_root="$RUNNER_TEMP/maru-session-host-tombstone-$MARU_ATTEMPT"
          mountpoint="$evidence_root/mount"
          output="$evidence_root/tombstone-relaunch.json"
          test ! -e "$root"
          test ! -e "$evidence_root"
          /bin/mkdir -m 0700 "$evidence_root"
          /bin/mkdir -m 0700 "$mountpoint"
          mounted=false
          cleanup() {
            if $mounted; then /usr/bin/hdiutil detach "$mountpoint" >/dev/null; fi
            case "$root" in /tmp/mt-[0-9a-f][0-9a-f]*) /bin/rm -rf "$root" ;; esac
          }
          trap cleanup EXIT HUP INT TERM
          /usr/bin/hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mountpoint" "$dmg" >/dev/null
          mounted=true
          /sbin/mount | /usr/bin/grep -F " on $mountpoint " | /usr/bin/grep -Fq 'read-only'
          app="$mountpoint/Maru.app"
          test "$(/usr/bin/stat -f '%HT' "$app/Contents/MacOS/maru-macos-app")" = 'Regular File'
          test ! -L "$app/Contents/MacOS/maru-macos-app"
          /usr/bin/env -i PATH="$PATH" HOME="$HOME" \
            mise exec -- zig build macos-session-host-signed-tombstone-evidence \
              -Dsession-host-tombstone-candidate-app="$app" \
              -Dsession-host-tombstone-candidate-dmg="$dmg" \
              -Dsession-host-tombstone-test-uuid="$test_uuid" \
              -Dsession-host-tombstone-root="$root" \
              -Dsession-host-tombstone-output="$output"
          test "$mounted" = true
          /usr/bin/hdiutil detach "$mountpoint" >/dev/null
          mounted=false
          test "$(/usr/bin/stat -f '%HT' "$output")" = 'Regular File'
          test "$(( $(/usr/bin/stat -f '%Lp' "$output") ))" -eq 600
          test ! -L "$output"
          test "$(/usr/bin/jq -r '.schema' "$output")" = 'maru.session-host-signed-tombstone-relaunch.v1'
          printf 'output=%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Attest durable-tombstone evidence
        id: tombstone-attestation
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ steps.tombstone-product.outputs.output }}

      - name: Freeze durable-tombstone attestation bundle
        id: tombstone-bundle
        shell: bash
        env:
          MARU_SOURCE_BUNDLE: ${{ steps.tombstone-attestation.outputs.bundle-path }}
          MARU_OUTPUT: ${{ steps.tombstone-product.outputs.output }}
        run: |
          set -euo pipefail
          umask 077
          bundle="${MARU_OUTPUT%/*}/tombstone-relaunch.bundle.json"
          test "$(/usr/bin/stat -f '%HT' "$MARU_SOURCE_BUNDLE")" = 'Regular File'
          test ! -L "$MARU_SOURCE_BUNDLE"
          test ! -e "$bundle"
          /bin/cp "$MARU_SOURCE_BUNDLE" "$bundle"
          /bin/chmod 0600 "$bundle"
          /usr/bin/cmp -s "$MARU_SOURCE_BUNDLE" "$bundle"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload exact-attempt durable-tombstone evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-host-tombstone-product-${{ github.run_attempt }}
          path: |
            ${{ steps.tombstone-product.outputs.output }}
            ${{ steps.tombstone-bundle.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14

  session-host-tombstone-verification:
    name: session host tombstone verification
    needs: session-host-tombstone-product
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Capture trusted GitHub CLI before checkout
        id: tombstone-trusted-gh
        shell: bash
        run: |
          set -euo pipefail
          canonical=$(/usr/bin/realpath "$(command -v gh)")
          test "$canonical" = "${canonical//$'\n'/}"
          test "$canonical" = "${canonical//$'\r'/}"
          test "$(/usr/bin/stat -f '%HT' "$canonical")" = 'Regular File'
          test -x "$canonical"
          sha256=$(/usr/bin/shasum -a 256 "$canonical" | /usr/bin/awk '{print $1}')
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'path=%s\nsha256=%s\n' "$canonical" "$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Download exact-attempt durable-tombstone evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: session-host-tombstone-product-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-host-tombstone-product-${{ github.run_attempt }}

      - name: Build durable-tombstone workflow verifier
        run: mise exec -- zig build session-host-release-tombstone-workflow-verifier -Doptimize=ReleaseFast

      - name: Verify protected durable-tombstone product verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_GH: ${{ steps.tombstone-trusted-gh.outputs.path }}
          TRUSTED_GH_SHA256: ${{ steps.tombstone-trusted-gh.outputs.sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="$RUNNER_TEMP/session-host-tombstone-product-$GITHUB_RUN_ATTEMPT"
          evidence="$root/tombstone-relaunch.json"
          bundle="$root/tombstone-relaunch.bundle.json"
          files=("$root"/*)
          test "${#files[@]}" -eq 2
          for path in "$evidence" "$bundle"; do
            test "$(/usr/bin/stat -f '%HT' "$path")" = 'Regular File'
            test ! -L "$path"
          done
          output="$RUNNER_TEMP/session-host-tombstone-workflow-pass.json"
          test ! -e "$output"
          verifier="$GITHUB_WORKSPACE/zig-out/bin/maru-session-host-release-tombstone-workflow-verifier"
          "$verifier" verify "$TRUSTED_GH" "$TRUSTED_GH_SHA256" "$evidence" "$bundle" "$output"
          test "$(/usr/bin/stat -f '%HT' "$output")" = 'Regular File'
          test "$(/usr/bin/stat -f '%Lp' "$output")" = '400'
          test "$(/usr/bin/jq -r '.schema' "$output")" = 'maru.session-host-tombstone-workflow-pass.v1'

      - name: Upload canonical durable-tombstone workflow pass record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-host-tombstone-workflow-pass-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-host-tombstone-workflow-pass.json
          if-no-files-found: error
          retention-days: 90

  session-host-notification-product:
    name: session host notification product
    needs: universal-dmg
    environment: Session host product
    runs-on: [self-hosted, macOS, ARM64, session-host-product]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Download exact-attempt signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maru-universal-dmg-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maru-session-host-notification-candidate-${{ github.run_attempt }}

      - name: Derive closed Notification Center product paths
        id: notification-setup
        shell: bash
        env:
          MARU_REF_TYPE: ${{ github.ref_type }}
          MARU_TAG: ${{ github.ref_name }}
          MARU_REPOSITORY: ${{ github.repository }}
          MARU_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          test "$MARU_REF_TYPE" = tag
          test "$MARU_REPOSITORY" = ohah/maru
          case "$MARU_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) exit 1 ;;
          esac
          MARU_VERSION=${MARU_TAG#v}
          MARU_CANDIDATE="$RUNNER_TEMP/maru-session-host-notification-candidate-$MARU_ATTEMPT"
          MARU_DMG="$MARU_CANDIDATE/Maru-$MARU_VERSION-universal.dmg"
          test "$(/usr/bin/stat -f '%HT' "$MARU_DMG")" = 'Regular File'
          test ! -L "$MARU_DMG"
          MARU_ROOT="$RUNNER_TEMP/maru-session-host-notification-$MARU_ATTEMPT"
          test ! -e "$MARU_ROOT"
          test ! -L "$MARU_ROOT"
          /bin/mkdir -m 0700 "$MARU_ROOT"
          MARU_TEST_UUID=$(/usr/bin/uuidgen | /usr/bin/tr '[:upper:]' '[:lower:]')
          MARU_ZERO_UUID=$(/usr/bin/uuidgen | /usr/bin/tr '[:upper:]' '[:lower:]')
          MARU_LIVE_UUID=$(/usr/bin/uuidgen | /usr/bin/tr '[:upper:]' '[:lower:]')
          for value in "$MARU_TEST_UUID" "$MARU_ZERO_UUID" "$MARU_LIVE_UUID"; do
            [[ "$value" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          done
          test "$MARU_TEST_UUID" != "$MARU_ZERO_UUID"
          test "$MARU_TEST_UUID" != "$MARU_LIVE_UUID"
          test "$MARU_ZERO_UUID" != "$MARU_LIVE_UUID"
          MARU_ZERO_COMPACT=${MARU_ZERO_UUID//-/}
          MARU_LIVE_COMPACT=${MARU_LIVE_UUID//-/}
          {
            printf 'test-uuid=%s\n' "$MARU_TEST_UUID"
            printf 'zero-uuid=%s\n' "$MARU_ZERO_UUID"
            printf 'live-uuid=%s\n' "$MARU_LIVE_UUID"
            printf 'dmg=%s\n' "$MARU_DMG"
            printf 'preflight-dmg-work=%s/preflight-dmg-work\n' "$MARU_ROOT"
            printf 'product-dmg-work=%s/product-dmg-work\n' "$MARU_ROOT"
            printf 'zero-root=/tmp/mn-%s\n' "$MARU_ZERO_COMPACT"
            printf 'live-root=/tmp/mn-%s\n' "$MARU_LIVE_COMPACT"
            printf 'zero-receipt=%s/gui-zero.json\n' "$MARU_ROOT"
            printf 'live-receipt=%s/gui-live.json\n' "$MARU_ROOT"
            printf 'output=%s/notification-center.json\n' "$MARU_ROOT"
            printf 'bundle-copy=%s/notification-center.bundle.json\n' "$MARU_ROOT"
            printf 'result=%s/notification-center-result.json\n' "$MARU_ROOT"
          } >> "$GITHUB_OUTPUT"

      - name: Build token-free Notification Center candidate runner
        run: mise exec -- zig build session-host-release-notification-candidate -Doptimize=ReleaseFast

      - name: Run signed Notification Center product transaction
        shell: bash
        env:
          MARU_EXE: ${{ github.workspace }}/zig-out/bin/maru-session-host-release-notification-candidate
          MARU_TEST_UUID: ${{ steps.notification-setup.outputs.test-uuid }}
          MARU_ZERO_UUID: ${{ steps.notification-setup.outputs.zero-uuid }}
          MARU_LIVE_UUID: ${{ steps.notification-setup.outputs.live-uuid }}
          MARU_DMG: ${{ steps.notification-setup.outputs.dmg }}
          MARU_PREFLIGHT_DMG_WORK: ${{ steps.notification-setup.outputs.preflight-dmg-work }}
          MARU_PRODUCT_DMG_WORK: ${{ steps.notification-setup.outputs.product-dmg-work }}
          MARU_ZERO_ROOT: ${{ steps.notification-setup.outputs.zero-root }}
          MARU_LIVE_ROOT: ${{ steps.notification-setup.outputs.live-root }}
          MARU_ZERO_RECEIPT: ${{ steps.notification-setup.outputs.zero-receipt }}
          MARU_LIVE_RECEIPT: ${{ steps.notification-setup.outputs.live-receipt }}
          MARU_OUTPUT: ${{ steps.notification-setup.outputs.output }}
          MARU_RESULT: ${{ steps.notification-setup.outputs.result }}
        run: |
          set -euo pipefail
          test ! -e "$MARU_RESULT"
          set +e
          /usr/bin/env -i \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_REF_TYPE="$GITHUB_REF_TYPE" \
            GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF_PROTECTED="$GITHUB_REF_PROTECTED" \
            "$MARU_EXE" run \
              --test-uuid "$MARU_TEST_UUID" --zero-uuid "$MARU_ZERO_UUID" --live-uuid "$MARU_LIVE_UUID" \
              --dmg "$MARU_DMG" --preflight-dmg-work "$MARU_PREFLIGHT_DMG_WORK" \
              --product-dmg-work "$MARU_PRODUCT_DMG_WORK" --zero-root "$MARU_ZERO_ROOT" \
              --live-root "$MARU_LIVE_ROOT" --zero-receipt "$MARU_ZERO_RECEIPT" \
              --live-receipt "$MARU_LIVE_RECEIPT" --output "$MARU_OUTPUT"
          status=$?
          set -e
          case "$status" in
            0) result=passed ;;
            70) result=not_provisioned_accessibility ;;
            71) result=not_provisioned_aqua ;;
            *) result=failed ;;
          esac
          /usr/bin/jq -cn \
            --arg schema 'maru.session-host-notification-product-result.v1' \
            --arg result "$result" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg test_uuid "$MARU_TEST_UUID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson exit_code "$status" \
            '{$schema,$result,$repository,$source_sha,$run_id,$run_attempt,$test_uuid,$exit_code}' > "$MARU_RESULT"
          test "$status" -eq 0
          test "$(/usr/bin/jq -r '.schema' "$MARU_OUTPUT")" = 'maru.session-host-notification-center.v1'

      - name: Upload typed Notification Center product result
        if: always() && steps.notification-setup.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-host-notification-result-${{ github.run_attempt }}
          path: ${{ steps.notification-setup.outputs.result }}
          if-no-files-found: error
          retention-days: 14

      - name: Attest Notification Center evidence
        id: notification-attestation
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ steps.notification-setup.outputs.output }}

      - name: Freeze Notification Center attestation bundle
        shell: bash
        env:
          MARU_SOURCE_BUNDLE: ${{ steps.notification-attestation.outputs.bundle-path }}
          MARU_BUNDLE_COPY: ${{ steps.notification-setup.outputs.bundle-copy }}
        run: |
          set -euo pipefail
          umask 077
          test "$(/usr/bin/stat -f '%HT' "$MARU_SOURCE_BUNDLE")" = 'Regular File'
          test ! -L "$MARU_SOURCE_BUNDLE"
          test ! -e "$MARU_BUNDLE_COPY"
          /bin/cp "$MARU_SOURCE_BUNDLE" "$MARU_BUNDLE_COPY"
          /bin/chmod 0600 "$MARU_BUNDLE_COPY"
          test "$(/usr/bin/stat -f '%HT' "$MARU_BUNDLE_COPY")" = 'Regular File'
          test "$(/usr/bin/stat -f '%Lp' "$MARU_BUNDLE_COPY")" = '600'
          test ! -L "$MARU_BUNDLE_COPY"
          /usr/bin/cmp -s "$MARU_SOURCE_BUNDLE" "$MARU_BUNDLE_COPY"

      - name: Upload exact-attempt Notification Center evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-host-notification-product-${{ github.run_attempt }}
          path: |
            ${{ steps.notification-setup.outputs.output }}
            ${{ steps.notification-setup.outputs.bundle-copy }}
          if-no-files-found: error
          retention-days: 14

  session-host-notification-verification:
    name: session host notification verification
    needs: session-host-notification-product
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Capture trusted GitHub CLI before checkout
        id: notification-trusted-gh
        shell: bash
        run: |
          set -euo pipefail
          canonical=$(/usr/bin/realpath "$(command -v gh)")
          test "$canonical" = "${canonical//$'\n'/}"
          test "$canonical" = "${canonical//$'\r'/}"
          test "$(/usr/bin/stat -f '%HT' "$canonical")" = 'Regular File'
          test -x "$canonical"
          sha256=$(/usr/bin/shasum -a 256 "$canonical" | /usr/bin/awk '{print $1}')
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'path=%s\nsha256=%s\n' "$canonical" "$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Download exact-attempt Notification Center evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: session-host-notification-product-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-host-notification-product-${{ github.run_attempt }}

      - name: Build Notification Center workflow verifier
        run: mise exec -- zig build session-host-release-notification-workflow-verifier -Doptimize=ReleaseFast

      - name: Verify protected Notification Center product verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_GH: ${{ steps.notification-trusted-gh.outputs.path }}
          TRUSTED_GH_SHA256: ${{ steps.notification-trusted-gh.outputs.sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="$RUNNER_TEMP/session-host-notification-product-$GITHUB_RUN_ATTEMPT"
          evidence="$root/notification-center.json"
          files=("$root"/*)
          test "${#files[@]}" -eq 2
          test "$(/usr/bin/stat -f '%HT' "$evidence")" = 'Regular File'
          test ! -L "$evidence"
          bundle=''
          for path in "${files[@]}"; do
            test "$(/usr/bin/stat -f '%HT' "$path")" = 'Regular File'
            test ! -L "$path"
            if [ "$path" != "$evidence" ]; then bundle="$path"; fi
          done
          test -n "$bundle"
          output="$RUNNER_TEMP/session-host-notification-workflow-pass.json"
          test ! -e "$output"
          verifier="$GITHUB_WORKSPACE/zig-out/bin/maru-session-host-release-notification-workflow-verifier"
          "$verifier" verify "$TRUSTED_GH" "$TRUSTED_GH_SHA256" "$evidence" "$bundle" "$output"
          test "$(/usr/bin/stat -f '%HT' "$output")" = 'Regular File'
          test "$(/usr/bin/stat -f '%Lp' "$output")" = '400'
          test "$(/usr/bin/jq -r '.schema' "$output")" = 'maru.session-host-notification-workflow-pass.v1'

      - name: Upload canonical Notification Center workflow pass record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-host-notification-workflow-pass-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-host-notification-workflow-pass.json
          if-no-files-found: error
          retention-days: 90

  session-host-release-live-timing:
    name: session host live release timing
    needs: universal-dmg
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Record GitHub-issued live action timing
        env:
          GH_TOKEN: ${{ github.token }}
          MARU_REPOSITORY: ${{ github.repository }}
          MARU_RUN_ID: ${{ github.run_id }}
          MARU_RUN_ATTEMPT: ${{ github.run_attempt }}
          MARU_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$MARU_REPOSITORY" = ohah/maru
          [[ "$MARU_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MARU_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$MARU_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh_path=$(command -v gh)
          GH=$(/usr/bin/realpath "$gh_path")
          test -x "$GH"
          response="$RUNNER_TEMP/session-host-release-live-jobs.json"
          record="$RUNNER_TEMP/session-host-release-live-timing.json"
          test ! -e "$response"
          test ! -L "$response"
          test ! -e "$record"
          test ! -L "$record"
          for attempt in $(/usr/bin/seq 1 12); do
            "$GH" api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$MARU_REPOSITORY/actions/runs/$MARU_RUN_ID/attempts/$MARU_RUN_ATTEMPT/jobs?per_page=100" > "$response"
            if /usr/bin/jq -e \
              --arg source "$MARU_SOURCE_SHA" \
              '[.jobs[] | select(.name == "universal dmg (signed + notarized)")] as $jobs |
               (.total_count <= 100) and ($jobs | length == 1) and
               ($jobs[0].head_sha == $source) and ($jobs[0].conclusion == "success") and
               ([$jobs[0].steps[] | select(.name == "Run session host live release workflow")] | length == 1) and
               ([$jobs[0].steps[] | select(.name == "Run session host live release workflow")][0] |
                 .conclusion == "success" and (.started_at | type == "string") and (.completed_at | type == "string"))' \
              "$response" > /dev/null
            then
              break
            fi
            test "$attempt" -lt 12
            /bin/sleep 5
          done
          started=$(/usr/bin/jq -r '.jobs[] | select(.name == "universal dmg (signed + notarized)") | .steps[] | select(.name == "Run session host live release workflow") | .started_at' "$response")
          completed=$(/usr/bin/jq -r '.jobs[] | select(.name == "universal dmg (signed + notarized)") | .steps[] | select(.name == "Run session host live release workflow") | .completed_at' "$response")
          started_ms=$(/usr/bin/date -u --date="$started" +%s%3N)
          completed_ms=$(/usr/bin/date -u --date="$completed" +%s%3N)
          test "$completed_ms" -gt "$started_ms"
          duration_ms=$((completed_ms - started_ms))
          /usr/bin/jq -cn \
            --arg schema 'maru.session-host-release-live-timing.v1' \
            --arg repository "$MARU_REPOSITORY" \
            --arg workflow 'release.yml' \
            --arg source_sha "$MARU_SOURCE_SHA" \
            --arg job_name 'universal dmg (signed + notarized)' \
            --arg step_name 'Run session host live release workflow' \
            --arg started_at "$started" \
            --arg completed_at "$completed" \
            --argjson run_id "$MARU_RUN_ID" \
            --argjson run_attempt "$MARU_RUN_ATTEMPT" \
            --argjson duration_ms "$duration_ms" \
            '{$schema,$repository,$workflow,$run_id,$run_attempt,$source_sha,$job_name,$step_name,$started_at,$completed_at,$duration_ms}' > "$record"
          /usr/bin/jq -e '.schema == "maru.session-host-release-live-timing.v1" and .duration_ms > 0' "$record" > /dev/null

      - name: Upload GitHub-issued live action timing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-host-release-live-timing-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-host-release-live-timing.json
          if-no-files-found: error
          retention-days: 90

  session-host-release-live-timing-verification:
    name: session host live timing verification
    needs: session-host-release-live-timing
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Capture trusted GitHub CLI before checkout
        id: trusted-gh
        shell: bash
        run: |
          set -euo pipefail
          discovered=$(command -v gh)
          canonical=$(/usr/bin/realpath "$discovered")
          case "$canonical" in
            /*) ;;
            *) exit 1 ;;
          esac
          [[ "$canonical" != *$'\n'* && "$canonical" != *$'\r'* ]]
          test "$(/usr/bin/stat -f '%HT' "$canonical")" = 'Regular File'
          test -x "$canonical"
          sha256=$(/usr/bin/shasum -a 256 "$canonical" | /usr/bin/awk '{print $1}')
          case "$sha256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#sha256}" = 64
          printf 'path=%s\n' "$canonical" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Build live timing verifier
        run: mise exec -- zig build session-host-release-live-timing-verifier -Doptimize=ReleaseFast

      - name: Verify current GitHub-issued live timing
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_GH: ${{ steps.trusted-gh.outputs.path }}
          TRUSTED_GH_SHA256: ${{ steps.trusted-gh.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          workspace="$RUNNER_TEMP/maru-session-host-live-timing-verifier-$GITHUB_RUN_ATTEMPT"
          stdout="$RUNNER_TEMP/maru-session-host-live-timing-verifier.stdout"
          stderr="$RUNNER_TEMP/maru-session-host-live-timing-verifier.stderr"
          test ! -e "$workspace"
          test ! -e "$stdout"
          test ! -e "$stderr"
          cleanup() {
            /bin/rm -f "$stdout" "$stderr"
          }
          trap cleanup EXIT
          verifier="$GITHUB_WORKSPACE/zig-out/bin/maru-session-host-release-live-timing-verifier"
          "$verifier" verify "$TRUSTED_GH" "$TRUSTED_GH_SHA256" "$workspace" > "$stdout" 2> "$stderr"
          test ! -s "$stdout"
          test ! -s "$stderr"
          test ! -e "$workspace"

  session-host-release-remote-verification:
    name: session host remote release verification
    needs: session-host-release-live-timing-verification
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Capture trusted GitHub CLI before checkout
        id: trusted-gh
        shell: bash
        run: |
          set -euo pipefail
          discovered=$(command -v gh)
          canonical=$(/usr/bin/realpath "$discovered")
          case "$canonical" in
            /*) ;;
            *) exit 1 ;;
          esac
          [[ "$canonical" != *$'\n'* && "$canonical" != *$'\r'* ]]
          test "$(/usr/bin/stat -f '%HT' "$canonical")" = 'Regular File'
          test -x "$canonical"
          sha256=$(/usr/bin/shasum -a 256 "$canonical" | /usr/bin/awk '{print $1}')
          case "$sha256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#sha256}" = 64
          printf 'path=%s\n' "$canonical" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Build remote Release verifier
        run: mise exec -- zig build session-host-release-remote-verifier -Doptimize=ReleaseFast

      - name: Verify current remote Release verdict
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_GH: ${{ steps.trusted-gh.outputs.path }}
          TRUSTED_GH_SHA256: ${{ steps.trusted-gh.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          timing_workspace="$RUNNER_TEMP/maru-session-host-remote-timing-$GITHUB_RUN_ATTEMPT"
          release_workspace="$RUNNER_TEMP/maru-session-host-remote-release-$GITHUB_RUN_ATTEMPT"
          pass_record="$RUNNER_TEMP/session-host-release-remote-pass.json"
          stdout="$RUNNER_TEMP/maru-session-host-remote-verifier.stdout"
          stderr="$RUNNER_TEMP/maru-session-host-remote-verifier.stderr"
          test ! -e "$timing_workspace"
          test ! -e "$release_workspace"
