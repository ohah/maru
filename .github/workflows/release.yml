name: Release

# 배포 플로우(docs/distribution.md "CI 릴리스"). 태그 푸시(v*) 시 universal(arm64+x86_64)
# .dmg를 서명·공증·staple한 뒤 새 draft에서 재다운로드 검증하고 GitHub Release로 publish한다. 실제 배포는 아래 Secret 세팅 + 태그 푸시가
# 있어야 동작한다(없으면 인증서 import 단계에서 멈춘다 — 의도된 가드). 서명 Secret을 caller가 고른 임의 ref에
# 노출하지 않도록 수동 실행은 제공하지 않는다.
#
# 필요한 Secret (Settings > Secrets and variables > Actions):
#   MACOS_CERT_P12              Developer ID Application 인증서 .p12 를 base64 인코딩한 값
#   MACOS_CERT_PASSWORD         위 .p12 의 비밀번호
#   KEYCHAIN_PASSWORD           CI 임시 키체인 잠금 비번(아무 값, 이 잡에서만 씀)
#   APPLE_ID                    공증용 Apple 계정 이메일
#   APPLE_TEAM_ID               팀 ID (10자 영숫자)
#   APPLE_APP_SPECIFIC_PASSWORD 공증용 앱 전용 암호
# 비밀값은 리포에 두지 않는다 — 모두 Secret으로 주입한다(distribution.md "서명·공증").

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release 생성/업로드

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-dmg:
    name: universal dmg (signed + notarized)
    environment: release
    # Apple Silicon — arm64 네이티브 + x86_64 cross.
    runs-on: macos-15
    steps:
      # Repository bytes가 PATH나 executable digest를 바꾸기 전에 runner-provided gh를 고정한다.
      # 후속 validator는 환경변수나 PATH를 다시 읽지 않고 이 step output만 argv로 소비한다.
      - name: Capture trusted GitHub CLI before checkout
        id: trusted-gh
        shell: bash
        run: |
          set -euo pipefail
          discovered=$(command -v gh)
          canonical=$(/usr/bin/realpath "$discovered")
          case "$canonical" in
            /*) ;;
            *) exit 1 ;;
          esac
          [[ "$canonical" != *$'\n'* && "$canonical" != *$'\r'* ]]
          test "$(/usr/bin/stat -f '%HT' "$canonical")" = 'Regular File'
          test -x "$canonical"
          sha256=$(/usr/bin/shasum -a 256 "$canonical" | /usr/bin/awk '{print $1}')
          case "$sha256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#sha256}" = 64
          printf 'path=%s\n' "$canonical" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2, .mise.toml 의 zig 0.16
        with:
          # PR에서는 캐시를 **쓰지 않는다**(읽기는 유지). GitHub 캐시는 ref 스코프라 `refs/pull/N/merge`에
          # 저장된 툴체인 캐시는 그 PR만 읽을 수 있고, PR이 닫히면 영영 못 읽으면서 한도(10GB)만 먹는다.
          # 실측: 닫힌 PR 13개가 남긴 죽은 캐시 36개 = 4.9GB. main push는 그대로 저장해 모두가 읽는다.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Verify release version SSOT
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            zig build check-release-version -Drelease-tag="$RELEASE_TAG"
          else
            zig build check-release-version
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/maru-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # codesign이 키 접근 시 UI 프롬프트 없이 쓰도록 partition list 설정.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$kc"
          # 새 키체인을 검색 목록 맨 앞에 추가(기존 목록 보존) — codesign이 인증서를 찾게 한다.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # 로컬과 동일한 프로파일 이름(maru-notary)으로 저장 → 빌드 스크립트를 그대로 재사용한다.
          xcrun notarytool store-credentials maru-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build signed + notarized universal dmg
        run: sh tools/build-macos-universal-dmg.sh

      - name: Upload dmg to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sh tools/publish-github-release.sh "$RELEASE_TAG" dist/Maru-*-universal.dmg

      - name: Upload dmg as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maru-universal-dmg
          path: dist/Maru-*-universal.dmg
          if-no-files-found: warn
          retention-days: 14

      # TODO(후속): Homebrew tap(ohah/homebrew-maru) cask version/sha256 자동 bump PR.
      # tap repo write 토큰이 필요해 별도로 추가한다(distribution.md "CI 릴리스" 5단계).
