name: Web

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - ".mise.toml"
      - "web/**"
  # 트리거는 모든 PR에 열어 둔다(paths 필터를 두면 무관한 PR에서 워크플로가 아예 안 돌아 required
  # 체크가 영원히 pending으로 머지를 막는다 — performance.yml과 같은 이유). 대신 아래 job이
  # tools/ci/changed-areas.sh의 판정으로 건너뛴다 — 조건으로 skip된 job은 통과로 보고된다.
  # 필수 CI 체크 목록의 단일 출처는 docs/performance-budget.md "필수 CI 체크"다.
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 분류 정책의 단일 출처는 tools/ci/changed-areas.sh다(ci.yml의 같은 job과 동일한 계약).
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.areas.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh tools/ci/changed-areas.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  check:
    name: web build and security fixtures
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # PR에서는 캐시를 **쓰지 않는다**(읽기는 유지). GitHub 캐시는 ref 스코프라 `refs/pull/N/merge`에
          # 저장된 툴체인 캐시는 그 PR만 읽을 수 있고, PR이 닫히면 영영 못 읽으면서 한도(10GB)만 먹는다.
          # 실측: 닫힌 PR 13개가 남긴 죽은 캐시 36개 = 4.9GB. main push는 그대로 저장해 모두가 읽는다.
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --cwd web --frozen-lockfile
      - run: mise run web:check
      - name: Upload zntc bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maru-web-build
          path: web/dist/**
          if-no-files-found: error
          retention-days: 14
