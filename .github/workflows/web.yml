name: Web

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - ".mise.toml"
      - "web/**"
      - "docs/file-panel.md"
      - "docs/web-panel.md"
  # PR 필수 체크로 쓰므로 모든 PR에서 돈다(paths 필터를 두면 무관한 PR에서 skip돼 required 체크가
  # 영원히 pending으로 머지를 막는다 — performance.yml과 같은 이유). 필수 CI 체크 목록의 단일 출처는
  # docs/performance-budget.md "필수 CI 체크"다.
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: web build and security fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --cwd web --frozen-lockfile
      - run: mise run web:check
      - name: Upload zntc bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maru-web-build
          path: web/dist/**
          if-no-files-found: error
          retention-days: 14
