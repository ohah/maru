[tools]
zig = "0.16.0"
bun = "1.4.0"

[tasks.build]
description = "Build Maru"
run = "zig build"

[tasks.test]
description = "Run Zig tests"
run = "zig build test"

[tasks.e2e]
description = "Run headless E2E tests"
run = "zig build test-e2e"

[tasks.demo]
description = "Run the headless PTY demo"
run = "zig build demo"

[tasks.app-smoke]
description = "Run the app host frame smoke"
run = "zig build app-smoke"

[tasks.app-loop-smoke]
description = "Run the app frame-loop contract smoke"
run = "zig build app-loop-smoke"

[tasks.app-pty-loop-smoke]
description = "Run the live PTY app frame-loop smoke"
run = "zig build app-pty-loop-smoke"

[tasks.app-pty-interactive-loop-smoke]
description = "Run the interactive shell app frame-loop smoke"
run = "zig build app-pty-interactive-loop-smoke"

[tasks.app-pty-smoke]
description = "Run the live PTY app host frame smoke"
run = "zig build app-pty-smoke"

[tasks.macos-window-smoke]
description = "Run the visible macOS AppKit window smoke"
run = "zig build macos-window-smoke"

[tasks.test-macos-window-smoke]
description = "Run macOS window smoke contract tests"
run = "zig build test-macos-window-smoke"

[tasks.macos-shader-compile-smoke]
description = "Compile every product Metal shader and assert its entry points exist"
run = "zig build macos-shader-compile-smoke"

[tasks.macos-metal-smoke]
description = "Run the visible macOS Metal GlyphFrame placeholder readback smoke"
run = "zig build macos-metal-smoke"

[tasks.test-macos-metal-smoke]
description = "Run macOS Metal smoke contract tests"
run = "zig build test-macos-metal-smoke"

[tasks.macos-chrome-lab-smoke]
description = "Capture deterministic Chrome Lab scenarios through the product Metal renderer"
run = "zig build macos-chrome-lab-smoke"

[tasks.macos-chrome-lab-font-review]
description = "Capture product font specimens and write nearest-neighbor 2x PR review PNGs (requires ffmpeg)"
depends = ["macos-chrome-lab-smoke"]
run = '''
set -eu
command -v ffmpeg >/dev/null
for input in zig-out/maru-macos-chrome-lab/font-specimen*.png; do
  case "$input" in
    *-review-2x.png) continue ;;
  esac
  output="${input%.png}-review-2x.png"
  ffmpeg -y -loglevel error -i "$input" -vf "scale=iw*2:ih*2:flags=neighbor" "$output"
done
'''

[tasks.test-macos-chrome-lab-smoke]
description = "Run Chrome Lab readback artifact contract tests"
run = "zig build test-macos-chrome-lab-smoke"

[tasks.macos-app-pty-metal-smoke]
description = "Run visible macOS live PTY Metal smoke"
run = "zig build macos-app-pty-metal-smoke"

[tasks.macos-app-pty-interactive-metal-smoke]
description = "Run visible macOS interactive shell PTY Metal smoke"
run = "zig build macos-app-pty-interactive-metal-smoke"

[tasks.test-macos-app-pty-metal-smoke]
description = "Run macOS live PTY Metal smoke contract tests"
run = "zig build test-macos-app-pty-metal-smoke"

[tasks.test-macos-app-host-abi]
description = "Run macOS Swift/Zig app host ABI contract tests"
run = "zig build test-macos-app-host-abi"

[tasks.macos-app-host-abi-lib]
description = "Build the Zig static library exported to the Swift macOS app host"
run = "zig build macos-app-host-abi-lib"

[tasks.check-macos-app-host]
# `check` 가 거는 얼굴. macOS 에서는 앱 호스트를 실제로 컴파일하고, 다른 OS 에서는 **왜 건너뛰는지 찍고**
# 통과한다. 조용한 skip 이 아니다 — 로그에 한 줄이 남아야 "돌았다"와 "못 돈다"를 구분할 수 있다.
# 다른 OS 를 통과시키는 근거: 이 라이브러리는 macOS 스텁 구조상 Linux 에서 빌드 자체가 불가능하다.
# CI 쪽은 macOS job 이 `macos-app-host-abi-lib` 를 직접 돈다 — `test-macos-app-host-abi` 로는 대신할 수
# 없다. 그 둘은 `build.zig` 에서 **각자 imports 를 가진 별개 모듈**이라(1139행 대 1399행), 라이브러리
# 쪽 배선만 깨지면 테스트 빌드는 초록이다.
description = "Compile the macOS app host on macOS; explain the skip elsewhere"
# **Windows 는 셸이 다르다.** mise 는 그 호스트에서 태스크를 `cmd` 로 돌리므로 아래 POSIX `if` 를
# 못 읽고 **스킵을 설명하려던 태스크가 스킵조차 못 하고 죽는다**(실측 2026-09-01 — 그런데 `error:`
# 도 `FAIL` 도 안 찍고 종료 코드로만 죽어, 메시지로 세던 집계가 이것을 놓쳤다).
# **줄은 ASCII 로 적는다** — `cmd` 는 레거시 코드페이지라 한글이 깨져 나온다(실측). 읽을 수 없는
# 줄은 없느니만 못하다: 이 태스크의 요점이 «건너뛴 이유가 로그에 남는 것» 이기 때문이다.
run_windows = "echo skip: macos-app-host-abi-lib builds only on macOS (session_host is a struct{} stub elsewhere) -- host is Windows"
run = """
if [ "$(uname -s)" = Darwin ]; then
  zig build macos-app-host-abi-lib
else
  echo "skip: macos-app-host-abi-lib는 macOS에서만 컴파일된다 (session_host가 비-macOS에서 struct{} 스텁) — 현재 $(uname -s)"
fi
"""

[tasks.macos-app-host-swift-check]
description = "Type-check the Swift macOS app host"
run = "zig build macos-app-host-swift-check"

[tasks.macos-app-instance-lease-smoke]
description = "Verify direct double-launch exclusion and SIGKILL lease reacquisition"
run = "zig build macos-app-instance-lease-smoke"

[tasks.macos-file-explorer-perf]
description = "Run the macOS AppSession file-explorer performance artifact gate"
run = "zig build test-macos-file-explorer-perf"

[tasks.clean-tmp-fixtures]
description = "Remove /tmp session-host fixture leftovers whose owner pid is gone (local hygiene; CI runners are fresh)"
run = "sh tools/clean-tmp-fixtures.sh"

[tasks.test-provider-session-removal]
description = "Verify provider continuity removal on the macOS product path"
run = "zig build test-provider-session-removal"

[tasks.macos-mermaid-helper-build]
description = "Build the isolated Mermaid renderer helper"
run = "zig build macos-mermaid-helper-build"

[tasks.macos-mermaid-helper-smoke]
description = "Run the isolated Mermaid helper lifecycle smoke"
run = "zig build macos-mermaid-helper-smoke"

[tasks.macos-editor-smoke]
description = "Run the MergeView WKWebView gate with a visible window"
run = "zig build macos-editor-smoke"

[tasks.test-macos-editor-smoke]
description = "Assert the MergeView product WKWebView gate (E0.5A)"
run = "zig build test-macos-editor-smoke"

[tasks.macos-mermaid-perf]
description = "Run the native Mermaid performance artifact gate"
run = "zig build -Doptimize=ReleaseSafe macos-mermaid-perf"

[tasks.macos-app-build]
description = "Build the runnable macOS Swift app host dev shell"
run = "zig build macos-app-build"

[tasks.macos-app]
description = "Run the macOS Swift app host dev shell"
run = "zig build macos-app"

[tasks.macos-app-smoke]
description = "Run the macOS Swift app host dev shell smoke"
run = "zig build macos-app-smoke"

[tasks.macos-session-host-r2a-checkpoint-smoke]
description = "Run actual AppKit duplicate runtime checkpoint rejection and preservation smoke"
run = "zig build macos-session-host-r2a-checkpoint-smoke"

[tasks.macos-session-host-r1-tombstone-smoke]
description = "Run actual AppKit durable tombstone relaunch and checkpoint smoke"
run = "zig build macos-session-host-r1-tombstone-smoke"

[tasks.macos-session-host-c4-quit-cancel-smoke]
description = "Run actual AppKit final checkpoint success and failure Quit handshake smoke"
run = "zig build macos-session-host-c4-quit-cancel-smoke"

[tasks.macos-session-host-recovery-smoke]
description = "Run the actual AppKit recovered-session discovery/click/render smoke"
run = "zig build macos-session-host-recovery-smoke"

[tasks.macos-session-host-input-continuity-smoke]
description = "Run actual AppKit recovered-session IME and OS clipboard continuity smoke"
run = "zig build macos-session-host-input-continuity-smoke"

[tasks.session-host-cr6e-baseline]
description = "Measure and validate the CR6e-a1 real stalled-peer transport baseline artifact"
run = "zig build test-session-host-cr6e-baseline-macos"

[tasks.session-host-cr6e-recovery-baseline]
description = "Measure and validate the CR6e-a2 repeated actual-AppKit recovery baseline artifact"
run = "zig build macos-session-host-cr6e-recovery-baseline -Doptimize=ReleaseFast"

[tasks.session-host-cr6e-budget]
description = "Collect one CR6e transport/recovery pair and enforce the pinned runner hard budgets"
run = """
zig build test-session-host-cr6e-baseline-macos
zig build macos-session-host-cr6e-recovery-baseline -Doptimize=ReleaseFast
zig run tools/perf/session_host_cr6e_budget_validator.zig -- tests/artifacts/perf/session-host-cr6e-baseline-macos.json tests/artifacts/perf/session-host-cr6e-recovery-baseline-macos.json
"""

[tasks.session-host-cr6e-soak]
description = "Run the CR6e-b 20-batch/100-AppKit-recovery long soak"
run = "tools/perf/session-host-cr6e-soak.sh"

[tasks.session-host-cr6f-output-wake]
description = "Measure and validate the CR6f real-PTY output wake latency artifact"
run = "zig build test-session-host-slow-observer-macos -Doptimize=ReleaseFast"

[tasks.macos-agent-session-archive-smoke]
description = "Run the visible AppKit Codex archive action fixture"
run = "zig build macos-agent-session-archive-smoke"

[tasks.test-dock-visual-golden]
description = "Compare Session Dock smoke captures against committed golden images"
run = "zig build test-dock-visual-golden"

[tasks.macos-dock-visual-golden]
description = "Capture Chrome Lab scenarios and gate them against committed golden images"
depends = ["macos-chrome-lab-smoke"]
# Lab을 먼저 돌렸으므로 캡처가 없다는 건 그 Lab이 실패했다는 뜻이다 — skip으로 넘기면 게이트가
# 무력화되고 아무도 눈치채지 못한다.
env = { MARU_REQUIRE_GOLDEN = "1" }
run = "zig build test-dock-visual-golden"

[tasks.macos-browser-bounded-smoke]
description = "Run and assert the bounded browser.executeScript WKWebView/socket smoke"
run = "zig build -Doptimize=ReleaseSafe macos-browser-bounded-smoke"

[tasks.macos-dmg]
description = "Sign+notarize+staple a distributable .dmg (needs keychain cert + notarytool profile)"
run = "zig build macos-dmg -Doptimize=ReleaseFast"

[tasks.macos-dmg-universal]
description = "Build a signed+notarized universal (arm64+x86_64) .dmg for release"
run = "sh tools/build-macos-universal-dmg.sh"

[tasks.macos-coretext-smoke]
description = "Run macOS CoreText font shaping/raster smoke"
run = "zig build macos-coretext-smoke"

[tasks.test-macos-coretext-smoke]
description = "Run macOS CoreText smoke contract tests"
run = "zig build test-macos-coretext-smoke"

[tasks.macos-glyph-texture-smoke]
description = "Run macOS CoreText-to-Metal glyph texture smoke"
run = "zig build macos-glyph-texture-smoke"

[tasks.test-macos-glyph-texture-smoke]
description = "Run macOS glyph texture smoke contract tests"
run = "zig build test-macos-glyph-texture-smoke"

[tasks.macos-glyph-text-smoke]
description = "Run visible macOS glyph text shader sampling smoke"
run = "zig build macos-glyph-text-smoke"

[tasks.test-macos-glyph-text-smoke]
description = "Run macOS glyph text smoke contract tests"
run = "zig build test-macos-glyph-text-smoke"

[tasks.pty]
description = "Run opt-in macOS PTY integration tests, including interactive shell smoke"
run = "zig build test-pty"

[tasks.oracle]
description = "Compare Maru against recorded terminal oracles"
run = "zig build test-oracle"

[tasks.oracle-ext]
description = "Validate goldens against a real libvterm reference (opt-in; requires libvterm)"
run = "zig build test-oracle-ext"

[tasks.oracle-ghostty]
description = "Validate goldens against Ghostty libghostty-vt (opt-in; requires prebuilt libghostty-vt.a)"
run = "zig build test-oracle-ghostty"

[tasks.oracle-alacritty]
description = "Validate goldens against Alacritty alacritty_terminal (opt-in; requires prebuilt Rust dumper)"
run = "zig build test-oracle-alacritty"

[tasks.stress]
description = "Run quick deterministic stress tests"
run = "zig build test-stress"

[tasks.stress-soak]
description = "Run longer opt-in stress tests"
run = "zig build test-stress-soak"

[tasks.perf]
description = "Run local performance budget harness"
run = "zig build perf"

[tasks.fmt]
description = "Format Zig sources"
run = "zig fmt build.zig src tests tools"

[tasks.test-verdict]
# `zig build test` 로그를 **빠짐없이** 판정한다 — `grep FAIL`은 크래시를 놓친다(러너가 그것을
# `Segmentation fault`로 찍는다). 실제로 그렇게 세그폴트가 한 커밋에 실려 밀렸다(2026-08-23).
# `N/N`은 완주일 뿐 통과가 아니므로 정식 게이트는 `check`다 — 이건 로그를 읽는 눈이다.
description = "Verdict a `zig build test` log (crashes, leaks, incomplete runs)"
run = "sh tools/test-verdict.sh"

[tasks.fmt-check]
description = "Check Zig formatting without modifying files"
run = "zig fmt --check build.zig src tests tools"

[tasks.check-boundaries]
description = "Check facade import boundaries"
run = "zig build check-boundaries"

[tasks."wasm-lib"]
# 브라우저용 터미널 코어를 **컴파일만** 한다(wasm 은 호스트에서 실행할 수 없다 — check-targets 와 같은 결).
# 산출물은 `zig-out/bin/maru-vt.wasm` 과 배포 자리 `packages/core/wasm/maru-vt.wasm` 둘 다에 놓인다.
description = "Build the WebAssembly terminal core"
run = "zig build wasm-lib"

[tasks."check-wasm-sync"]
# 커밋된 wasm 이 지금 소스에서 나온 것인지 확인한다. 바이너리를 커밋하는 대가로 드리프트가
# 생길 수 있어(소스만 고치고 재빌드를 잊는다) 해시를 대조한다.
description = "Verify the committed wasm matches a fresh build"
# **`wasm-lib` 에 의존하지 않는다.** 그 태스크는 산출물을 커밋 경로에도 놓아서, 먼저 돌면
# 비교 대상을 덮어써 이 게이트가 절대 실패할 수 없게 된다. 스크립트가 격리 prefix 로 직접
# 빌드한다.
run = "sh tools/check-wasm-sync.sh"

[tasks.check-targets]
# 다른 OS 타깃으로 **컴파일만** 해 본다(실행 없음). 중립 레이어가 세 백엔드(macOS·Windows·
# Unsupported)에서 다 컴파일되는지를 Windows/macOS 러너 없이 지키는 게이트다(계약 §4).
# `zig build test -Dtarget=…`는 게이트가 못 된다 — 산출물을 실행하려다 외래 타깃에서 항상 실패한다.
description = "Compile the neutral graph for macOS/Linux/Windows targets (no run)"
run = "zig build check-targets"

# external source digest는 대상 파일의 비-test 토큰 전체를 잠그므로 그 파일을 건드리는 거의 모든
# PR이 다시 써야 하고, main이 같은 파일을 건드리면 리베이스마다 또 다시 써야 한다. 그 손작업만
# 없앤다 — @field 사이트 수(count)가 바뀌면 도구가 갱신을 **거부**하므로 게이트의 신호는 남는다.
[tasks.update-boundary-digest]
description = "Refresh external source digests in tests/boundary/imports.zig (refuses when @field count changed)"
run = "python3 tools/update_boundary_digest.py"

[tasks."icons:check"]
description = "Regenerate explorer icon coverage in memory and fail on SVG/hash/C/Zig registry or name-registry(src/icons.zig) drift"
run = "python3 tools/svg_to_coverage.py --check"

# 모바일 계약은 **문서와 코드의 대조**라 Zig 테스트로는 못 잡는다(계약 문서가 하는 검증 가능한
# 주장 — "브리지에 OS 호출이 없다", "헤더가 숫자 표의 단일 출처다" 같은 것). 판정자는 grep 뭉치라
# 1초면 끝나므로 항상 돌린다. `sh` 는 CI(ubuntu)에서 dash 라, 그 위에서 도는 것까지 확인했다.
[tasks.check-mobile-contract]
description = "Check the mobile contract claims (bridge/host/header/docs) and ABI types"
run = "sh tools/mobile-harness/doc_claims.sh"

[tasks.check-config-docs]
description = "Check config docs against the real loader keys"
run = "zig build check-config-docs"

[tasks.check-doc-links]
description = "Check cross-document links and section anchors"
run = "zig build check-doc-links"

[tasks.check-doc-line-refs]
description = "Check code line references in docs still hit their symbol"
run = "zig build check-doc-line-refs"

[tasks."ci:changed-areas-check"]
description = "Verify the CI changed-area classifier (which jobs a diff must run)"
run = "sh tools/ci/changed-areas.test.sh"

[tasks.check]
description = "Check format, tests, boundaries, config docs, doc links, and build"
# **`macos-app-host-abi-lib`가 여기 있어야 하는 이유.** `build`(=`zig build`)도 `check-targets`도
# **macOS 앱 호스트를 컴파일하지 않는다** — 전자는 기본 스텝이라 그 라이브러리를 안 만들고,
# 후자는 `src/maru.zig`만 세 타깃으로 본다. 그래서 **앱이 안 빌드되는 변경이 게이트를 통과한다.**
# 2026-08-28 실측으로 확정했다: `app_host_abi` 모듈의 import 하나를 빼면 `zig build`와
# `check-targets`는 exit=0인데 `macos-app-host-abi-lib`만 exit=1이었다. 그 상태를 실제로 만들었고
# 라이선스 동봉을 확인하려다 우연히 발견했다 — 안 그랬으면 PR이 초록으로 올라갔다.
# **그런데 그 라이브러리는 macOS 에서만 컴파일된다.** `session_host.zig` 가 macOS 가 아니면 각 모듈을
# `struct {}` 로 스텁하므로, 앱 호스트는 Linux 에서 빌드가 **불가능**하다. CI 의 check job 은 ubuntu 라
# `macos-app-host-abi-lib` 를 직접 걸면 항상 빨갛다(2026-08-28 PR #2803 에서 실측했다 — 로컬 macOS 는
# 초록이었고 CI 만 8개 컴파일 오류로 죽었다). 그래서 OS 로 갈라지는 `check-macos-app-host` 를 건다.
depends = ["fmt-check", "test", "e2e", "oracle", "stress", "check-boundaries", "check-targets", "check-config-docs", "check-doc-links", "check-doc-line-refs", "check-mobile-contract", "check-wasm-sync", "check-macos-app-host", "build"]

[tasks."packages:check"]
# npm 라이브러리 게이트. Zig `check`와 분리된 opt-in 경로다(web:check와 같은 구조) —
# `check`는 packages/ 를 읽지 않고, 이쪽은 Zig 소스를 읽지 않는다. 둘을 잇는 것은
# `check-wasm-sync` 하나뿐이다(커밋된 wasm 이 Zig 소스에서 나왔는지).
description = "Run the @maru-term package gates (build, test, typecheck, lint, format)"
run = "bun run --cwd packages check"

[tasks."web:build"]
description = "Build the file-panel web bundle and verify its SRI"
run = "bun run --cwd web web:build"

[tasks."web:test"]
description = "Run file-panel renderer and sanitizer tests"
run = "bun run --cwd web web:test"

[tasks."web:lint"]
description = "Lint file-panel TypeScript with oxlint"
run = "bun run --cwd web web:lint"

[tasks."web:fmt"]
description = "Format file-panel TypeScript with oxfmt"
run = "bun run --cwd web web:fmt"

[tasks."web:fmt-check"]
description = "Check file-panel TypeScript formatting"
run = "bun run --cwd web web:fmt-check"

[tasks."web:licenses"]
description = "Audit the locked web dependency license set"
run = "bun run --cwd web web:licenses"

[tasks."web:check"]
description = "Run the opt-in file-panel web build, tests, lint, format, and license gates"
run = "bun run --cwd web web:check"

[tasks.vttest]
description = "Launch the Maru app for local vttest visual conformance (BSD tool; run `vttest` inside)"
run = "echo 'Maru 앱을 띄웁니다. 터미널 안에서 `vttest`를 실행해 시각 점검하세요(brew install vttest). docs/conformance-testing.md 참조.' && zig build macos-app"

[tasks.terminfo-check]
description = "Validate the opt-in maru terminfo (compiles clean, Sync 2026 round-trip, Tc) — run when editing terminfo/"
run = "sh tools/terminfo/check.sh"

[tasks.install-terminfo]
description = "Install the opt-in maru terminfo into ~/.terminfo (no sudo). Then set `term = \"xterm-maru\"`."
run = "sh tools/terminfo/install.sh"

[tasks.ssh-smoke]
description = "Opt-in `maru ssh` propagation smoke over `ssh localhost` (skips if no sshd/key). Needs `mise run build` first."
run = "sh tools/ssh/smoke.sh"

[tasks.ssh-client-smoke]
description = "Built-in SSH client real-server smoke — spins up a throwaway sshd, transfers 8MiB (skips if no sshd; MARU_SSH_SMOKE_REQUIRE=1 turns skip into failure)."
run = ["zig build ssh-client-smoke", "sh tools/ssh/client_smoke.sh"]
