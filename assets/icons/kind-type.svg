  <g transform="translate(0 1.25)">
    <path d="M2.6 2.6h5v5h-5Z M8.4 8.4h5v5h-5Z M5.1 7.6v3.3h3.3" fill="none" stroke="black" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
