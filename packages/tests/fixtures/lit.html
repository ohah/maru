<!doctype html>
<meta charset="utf-8" />
<title>maru-term lit</title>
<style>
  html,
  body {
    margin: 0;
    background: #000;
  }
  maru-terminal {
    display: block;
    width: 520px;
    height: 400px;
  }
</style>
<script type="importmap">
  {
    "imports": {
      "lit": "/node_modules/lit/index.js",
      "lit-html": "/node_modules/lit-html/lit-html.js",
      "lit-html/": "/node_modules/lit-html/",
      "lit-element/lit-element.js": "/node_modules/lit-element/lit-element.js",
      "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
      "@lit/reactive-element/": "/node_modules/@lit/reactive-element/",
      "@maru/core": "/core/dist/index.js"
    }
  }
</script>
<div id="host"></div>
<script type="module">
  import "/lit/dist/index.js";
  // 엘리먼트를 **속성과 리스너를 붙인 뒤** 문서에 넣는다. 마크업에 미리 두면
  // define 시점에 즉시 업그레이드돼 firstUpdated 가 options 없이 돌고 ready 도 놓친다.
  const el = document.createElement("maru-terminal");
  el.options = { cols: 50, rows: 15, worker: false, wasmUrl: "/core/wasm/maru-vt.wasm" };
  let gotReadyEvent = false;
  el.addEventListener("ready", () => {
    gotReadyEvent = true;
  });
  document.getElementById("host").append(el);
  // 이벤트에만 기대지 않는다 — 엘리먼트가 코어를 노출하면 준비된 것이다.
  const start = Date.now();
  while (!el.terminal && Date.now() - start < 10000) await new Promise((r) => setTimeout(r, 50));
  el.terminal.write("\x1b[1;32mlit\x1b[0m ok\r\n");
  await new Promise((r) => setTimeout(r, 150));
  globalThis.__readyEvent = gotReadyEvent;
  globalThis.__ready = true;
</script>
