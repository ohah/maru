<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style data-maru-critical-background>
      :root {
        color-scheme: light dark;
        background: Canvas;
        color: CanvasText;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: Canvas;
      }
    </style>
    <link rel="stylesheet" href="app.css" />
    <title>Maru file panel</title>
  </head>
  <body class="viewer-shell">
    <p id="viewer-status" role="status">파일을 읽는 중</p>
    <iframe
      id="renderer"
      title="Markdown 미리보기"
      src="maru-app://render/render.html"
      sandbox="allow-scripts allow-same-origin"
    ></iframe>
    <main id="editor" aria-label="Markdown 소스 편집기" hidden></main>
  </body>
</html>
